/* Layout: one 16:9 game stage (480x270 world, drawn at 2x) with look-book windows overlaid; touch pad below on phones.

:root {

  --atb: #f5a93a;
  --danger: #d23f3a;
  --memory-top: #3b2a62;

  --display: 'Cinzel Decorative', 'Palatino Linotype', Georgia, serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { height: 100%; background: var(--night); font-variant-ligatures: none; font-feature-settings: "liga" 0, "clig" 0; touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

  margin: 0; min-height: 100%; box-sizing: border-box;
  background: var(--night); color: var(--ink); font-family: var(--ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  -webkit-tap-highlight-color: transparent;
}
#stage {
  position: relative; width: min(100%, 1280px, calc((100vh - 64px) * 16 / 9)); width: min(100%, 1280px, calc((100dvh - 64px) * 16 / 9));
  aspect-ratio: 16 / 9; max-width: 100%;
  container-type: inline-size; background: #000;
  border: 1px solid var(--frame); border-radius: 4px; overflow: hidden;
  box-shadow: 0 0 0 3px #07080f, 0 0 0 4px #2a2442;
  user-select: none; -webkit-user-select: none; touch-action: none;
}
/* iOS 14 and older Safari: no aspect-ratio, so hold the 16:9 shape with padding */
@supports not (aspect-ratio: 16 / 9) { #stage::before { content: ''; display: block; padding-top: 56.25%; } #stage canvas#cv { position: absolute; top: 0; left: 0; } }
canvas#cv { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
.ov { position: absolute; }

/* Look-book window: navy gradient, dim gold border, bright gold corner brackets */

    linear-gradient(var(--c), var(--c)) right 3px top 3px / 9px 1px no-repeat,

    linear-gradient(var(--c), var(--c)) left 3px bottom 3px / 9px 1px no-repeat,
    linear-gradient(var(--c), var(--c)) left 3px bottom 3px / 1px 9px no-repeat,
    linear-gradient(var(--c), var(--c)) right 3px bottom 3px / 9px 1px no-repeat,
    linear-gradient(var(--c), var(--c)) right 3px bottom 3px / 1px 9px no-repeat,
    linear-gradient(180deg, var(--win-top), var(--win-bot));
  border: 1px solid var(--frame); border-radius: 3px;

#goal .g { display: block; margin-top: .25em; }

#goal.min, #goal.hush, .skinned #goal.min, .skinned #goal.hush { padding: 0; background: none; border-color: transparent; border-image: none; box-shadow: none; }
#goal.min .tab, #goal.hush .tab { position: static; transform: none; display: inline-block; }

.dtext { min-width: 0; }
#say { max-width: 68ch; }

#pause { inset: 4% 3% 3%; padding: 2vw 2.2vw; padding: 2cqw 2.2cqw; overflow: auto; touch-action: pan-y; overscroll-behavior: contain; font-size: clamp(11px, 1.8vw, 18px); font-size: clamp(11px, 1.8cqw, 18px); line-height: 1.35; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2vw; gap: 2cqw; align-items: start; }

#card h2 { margin: 0; font-family: var(--display); color: var(--gold); font-size: clamp(22px, 5.4vw, 64px); font-size: clamp(22px, 5.4cqw, 64px); text-wrap: balance; }

#pad button:active, #pad button.down { background: #343d78; }
.dpad { display: grid; grid-template-columns: repeat(3, min(52px, 12vw)); grid-template-rows: repeat(3, min(52px, 12vw)); gap: 4px; touch-action: none; }

/* Phones held upright: dialogue, battle menus and overlays move into the space under the game screen, in larger text */

  #dialog { min-height: 0; font-size: 15px; padding: 12px 14px 14px; gap: 10px 12px; overflow: auto; touch-action: pan-y; align-content: start; }
  #dialog #portrait { width: 76px; }
  /* answering: the box grows up over the bottom of the game screen so every answer fits, and the portrait shrinks */
  #dialog.choosing { top: auto; bottom: calc(-1 * var(--below) - 10px); height: auto; min-height: var(--below); max-height: calc(100% + var(--below) + 10px); font-size: 14px; }
  #dialog.choosing { grid-template-columns: minmax(0, 1fr); }
  #dialog.choosing #portrait { display: none; }
  #choices .opt { padding-block: .3em; }
  #who { position: static; transform: none; grid-column: 1 / -1; justify-self: start; font-size: 12px; margin-bottom: -4px; }
  #more { right: 12px; bottom: 8px; }
  #battle { font-size: 14px; grid-template-columns: minmax(0, 38%) minmax(0, 1fr); gap: 8px; }
  .prow { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); grid-template-areas: "n a" "h m"; gap: 4px 10px; }
  .prow .pn { grid-area: n; } .prow .atb { grid-area: a; } .prow .hpst { grid-area: h; } .prow .mpst { grid-area: m; }

  #titlebox { margin-top: auto; margin-bottom: calc(var(--below) * .3); font-size: 16px; }
  #pad { justify-content: space-around; }
  #pause { font-size: 14px; inset-block-start: 0; left: 0; right: 0; }
  #card p, #cardmenu { font-size: 15px; }
  #nameform { font-size: 16px; }
  #goal { font-size: 11px; max-width: 60%; }
  #banner { font-size: 13px; }
}
/* Phones held sideways: the stage fills the height and the controls sit at either side of it */

    const g = c.getContext('2d'); g.drawImage(im, 0, 0);
    const d = g.getImageData(0, 0, c.width, c.height), p = d.data;
    const [tr, tg, tb] = hex2rgb(hex);
    for (let i = 0; i < p.length; i += 4) {

function menu(el, items, { start = 0, noCancel = false } = {}) {

    if (sel < 0) sel = Math.max(0, items.findIndex(it => !it.dis));
    const nodes = items.map((it, i) => {
      const d = document.createElement('div');
      d.className = 'opt' + (it.dis ? ' dis' : '');
      d.innerHTML = `<span>${it.item ? itemIcon(it.item) : iconHTML(it.icon || it.label)}${it.tag ? `<b class="tag">${esc(it.tag)}</b>` : ''}<span>${esc(it.label)}</span></span>` + (it.sub ? `<span class="sub">${esc(it.sub)}</span>` : '');

      px(x + 2, y + 1, 12, 10, '#d0708a'); px(x + 1, y + 3, 14, 6, '#d0708a'); px(x + 4, y + 2, 5, 3, '#f08aa0'); px(x + 9, y + 6, 3, 2, '#f6b8c4');

      px(x + ((h * 29) % 14 | 0), y + 4 + fall, 1, 1, '#f6b8c4');
      break;
    }
    case 'l': {
      grass(); px(x + 4, y + 14, 8, 2, 'rgba(0,0,0,.25)');
      px(x + 7, y + 4, 2, 11, '#1b1f33'); px(x + 5, y, 6, 5, '#2a2f4a');
      ctx.globalAlpha = .8 + .2 * Math.sin(t * 5 + X); px(x + 6, y + 1, 4, 3, '#f5a93a'); ctx.globalAlpha = .18; fill('#f5a93a'); ctx.beginPath(); ctx.arc(x + 8, y + 3, 9, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
      break;
    }
    case 'b': {
      grass(); px(x + 1, y + 6, 14, 8, '#5a3a22'); px(x + 1, y + 6, 14, 1, '#7a5432');
      const cols = ['#f08aa0', '#f5a93a', '#c07ad8', '#dfe5df'];
      for (let i = 0; i < 6; i++) { px(x + 2 + i * 2, y + 7 + (i % 2) * 3, 2, 2, cols[(i + (h * 10 | 0)) % 4]); px(x + 2 + i * 2, y + 9 + (i % 2) * 3, 1, 1, '#2f6a3a'); }
      break;
    }
    case '~': { px(x, y, 16, 16, '#2a5a9a'); const o = (t * 8 + X * 4) % 16 | 0; px(x + o, y + 5, 4, 1, '#5a8ad0'); px(x + (o + 8) % 16, y + 11, 4, 1, '#5a8ad0'); break; }
    case 'f': {
      px(x, y, 16, 16, '#9a9ab4'); px(x + 2, y + 2, 12, 12, '#2f8fbf');
      if (tileAt(X - 1, Y) === 'f') px(x, y + 2, 2, 12, '#2f8fbf');
      if (tileAt(X + 1, Y) === 'f') px(x + 14, y + 2, 2, 12, '#2f8fbf');
      if (tileAt(X, Y - 1) === 'f') px(x + 2, y, 12, 2, '#2f8fbf');
      if (tileAt(X, Y + 1) === 'f') px(x + 2, y + 14, 12, 2, '#2f8fbf');
      const s = Math.sin(t * 3 + X * 2 + Y);
      px(x + 7 + s * 3, y + 6 + Math.cos(t * 2 + X) * 2, 2, 2, '#dfe5df');
      break;
    }
    case 'B': {
      px(x, y, 16, 16, '#4a2e1e');
      const cols = ['#8a2a2a', '#2a5a8a', '#3a6a3a', '#a08a3a', '#5a3a7a'];
      for (let r = 0; r < 3; r++) { for (let i = 0; i < 7; i++) px(x + 1 + i * 2, y + 1 + r * 5, 2, 4, cols[((h * 100 | 0) + i * 7 + r * 3) % 5]); px(x, y + 5 + r * 5, 16, 1, '#2e1a10'); }
      break;
    }
    case 't': floor(); px(x, y + 3, 16, 9, '#7a4e2a'); px(x, y + 3, 16, 2, '#9a6a3a'); px(x, y + 12, 16, 1, '#3a2414'); if (h > .55) { px(x + 7, y + 1, 2, 3, '#f2e6c9'); px(x + 7, y - 1 + Math.sin(t * 9 + X) * .6, 2, 2, '#f5a93a'); } break;
    case 'c': {
      if (MAPID === 'archive') px(x, y, 16, 16, '#1e1a2c'); else floor();
      const fl = Math.sin(t * 10 + X) > 0 ? 0 : 1;
      px(x + 4, y + 5, 8, 11, '#7a7e98'); px(x + 3, y + 3, 10, 3, '#9a9eb8');
      px(x + 5, y - 1 + fl, 6, 4, '#ec8a2f'); px(x + 6, y + fl, 4, 3, '#f5a93a'); break;
    }
    case 'd': px(x, y, 16, 16, '#3a2a20'); px(x + 1, y + 1, 14, 15, '#6a4628'); px(x + 7, y + 1, 2, 15, '#4a301a'); px(x + 5, y + 8, 1, 2, '#e2b25a'); px(x + 10, y + 8, 1, 2, '#e2b25a'); break;
    case 'g': {
      if (S.flags.archiveOpen) { px(x, y, 16, 16, '#1e1a2c'); ctx.globalAlpha = .4; px(x + 6, y + 6, 4, 4, '#c07ad8'); ctx.globalAlpha = 1; break; }
      px(x, y, 16, 16, '#24163a'); px(x + 1, y + 1, 14, 14, '#36225a');
      const side = tileAt(X + 1, Y) === 'g' ? 1 : -1;
      ctx.globalAlpha = .45 + .35 * Math.sin(t * 2); stroke('#c07ad8'); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(x + (side > 0 ? 16 : 0), y + 8, 6, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(x + (side > 0 ? 16 : 0), y + 8, 3, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
      break;
    }
    case 'x': px(x, y, 16, 16, '#1e1a2c'); px(x, y + 15, 16, 1, '#16131f'); px(x + 15, y, 1, 16, '#16131f'); if (h > .8) px(x + 5, y + 5, 2, 2, '#2a2440'); break;
    case 'X': px(x, y, 16, 16, '#120f1c'); for (let r = 0; r < 4; r++) px(x, y + r * 4, 16, 1, '#1c1830'); break;
    default: px(x, y, 16, 16, '#0b0d18');
  }
}

function drawPerson(x, y, o) {
  x = Math.round(x * 2) / 2; y = Math.round(y * 2) / 2;
  const { robe, trim, hair, skin, dir = 'down', step = 0, hat } = o;
  px(x + 3, y + 14, 10, 2, 'rgba(0,0,0,.3)');
  if (step) { px(x + 5, y + 12, 2, 3, '#1a1420'); px(x + 9, y + 13, 2, 2, '#1a1420'); }
  else { px(x + 5, y + 13, 2, 2, '#1a1420'); px(x + 9, y + 13, 2, 2, '#1a1420'); }
  px(x + 4, y + 8, 8, 5, robe); px(x + 3, y + 10, 10, 3, robe);
  px(x + 5, y + 8, 6, 1, trim);
  if (dir === 'down') px(x + 7, y + 9, 2, 3, trim);
  if (dir === 'left') px(x + 2, y + 9, 2, 2, skin);
  if (dir === 'right') px(x + 12, y + 9, 2, 2, skin);
  px(x + 5, y + 3, 6, 5, skin);
  px(x + 4, y + 2, 8, 2, hair);
  if (dir === 'up') px(x + 4, y + 2, 8, 6, hair);
  else if (dir === 'left') { px(x + 9, y + 3, 3, 4, hair); px(x + 6, y + 5, 1, 1, '#1a1420'); }
  else if (dir === 'right') { px(x + 4, y + 3, 3, 4, hair); px(x + 9, y + 5, 1, 1, '#1a1420'); }
  else { px(x + 4, y + 3, 1, 3, hair); px(x + 11, y + 3, 1, 3, hair); px(x + 6, y + 5, 1, 1, '#1a1420'); px(x + 9, y + 5, 1, 1, '#1a1420'); }
  if (hat) { px(x + 3, y + 2, 10, 1, hat); px(x + 5, y, 6, 2, hat); px(x + 6, y - 2, 4, 2, hat); px(x + 8, y - 4, 2, 2, hat); }
}

// k < 1 draws a smaller copy for the field map (k scales the Warden directly).
function drawFoe(art, cx, cy, t, k = 1, state) {
  const hd = IMG[`foe_${art}.png`];
  if (drawFoeSprite(art, cx, cy, t, state, art === 'warden' ? k : k < 1 ? (hd && hd.width > 256 ? .55 : .75) : 1)) return;
  if (art === 'echo') return drawFoe('warden', cx, cy, t, k * .75, state);
  if (drawPackFoe(art, cx, cy, t, state, k < 1)) return;
  const x = Math.round(cx), y = Math.round(cy);
  switch (art) {
    case 'dummy':
      px(x - 4, y + 9, 8, 2, 'rgba(0,0,0,.3)'); px(x - 1, y - 2, 2, 12, '#7a5a32'); px(x - 6, y - 1, 12, 2, '#7a5a32');
      px(x - 4, y - 9, 8, 8, '#d8c07a'); px(x - 3, y - 8, 6, 6, '#c0453a'); px(x - 2, y - 7, 4, 4, '#f2e6c9'); px(x - 1, y - 6, 2, 2, '#c0453a'); break;
    case 'imp': {
      const b = Math.sin(t * 6 + x) * 1.5;
      px(x - 6, y + 9, 12, 2, 'rgba(0,0,0,.3)');
      px(x - 6, y - 4 + b, 12, 10, '#1c1830'); px(x - 5, y - 6 + b, 10, 2, '#1c1830'); px(x - 6, y - 8 + b, 2, 3, '#1c1830'); px(x + 4, y - 8 + b, 2, 3, '#1c1830');
      px(x - 3, y - 2 + b, 2, 2, '#f5a93a'); px(x + 1, y - 2 + b, 2, 2, '#f5a93a'); px(x - 2, y + 2 + b, 4, 1, '#c04a6a');
      px(x - 7, y + 6, 4, 2, '#1c1830'); px(x + 3, y + 6, 4, 2, '#1c1830'); break;
    }
    case 'broom': {
      const a = Math.sin(t * 5 + x) * 2;
      px(x - 5, y + 11, 10, 2, 'rgba(0,0,0,.3)');
      px(x - 1 + a * .4, y - 11, 2, 14, '#9a6a3a'); px(x - 5, y + 2, 10, 3, '#c8a04a'); px(x - 6, y + 5, 12, 5, '#e0c060');
      px(x - 6, y + 9, 2, 2, '#e0c060'); px(x + 4, y + 9, 2, 2, '#e0c060'); px(x - 2, y + 3, 1, 1, '#1b1f33'); px(x + 1, y + 3, 1, 1, '#1b1f33'); break;
    }
    case 'wisp': {
      const r = 5 + Math.sin(t * 4 + x);
      ctx.globalAlpha = .25; fill('#c07ad8'); ctx.beginPath(); ctx.arc(x, y, r + 4, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
      fill('#3a2a6a'); ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
      px(x - 3, y - 1, 2, 2, '#dfe5df'); px(x + 1, y - 1, 2, 2, '#dfe5df'); px(x - 1, y + r - 1, 2, 4, '#3a2a6a'); break;
    }
    case 'toad':
      px(x - 8, y + 8, 16, 2, 'rgba(0,0,0,.3)');
      px(x - 8, y - 2, 16, 9, '#4a7a3a'); px(x - 6, y - 6, 4, 4, '#4a7a3a'); px(x + 2, y - 6, 4, 4, '#4a7a3a');
      px(x - 5, y - 5, 2, 2, '#f5a93a'); px(x + 3, y - 5, 2, 2, '#f5a93a'); px(x - 6, y + 3, 12, 3, '#9ac06a');
      px(x - 9, y + 6, 4, 2, '#3a6a2a'); px(x + 5, y + 6, 4, 2, '#3a6a2a'); break;
    case 'gargoyle': {
      const w = Math.sin(t * 3) * 2;
      px(x - 9, y + 11, 18, 2, 'rgba(0,0,0,.35)');
      px(x - 14, y - 8 + w, 7, 8, '#5a5e6a'); px(x + 7, y - 8 + w, 7, 8, '#5a5e6a');
      px(x - 7, y - 10, 14, 18, '#7a7e8a'); px(x - 6, y - 14, 4, 4, '#7a7e8a'); px(x + 2, y - 14, 4, 4, '#7a7e8a');
      px(x - 4, y - 6, 3, 2, '#d23f3a'); px(x + 1, y - 6, 3, 2, '#d23f3a'); px(x - 3, y - 1, 6, 2, '#4a4e5a');
      px(x - 8, y + 8, 6, 3, '#5a5e6a'); px(x + 2, y + 8, 6, 3, '#5a5e6a'); break;
    }
    case 'shade': {
      const f = Math.sin(t * 2 + x) * 1.5;
      px(x - 6, y - 12 + f, 12, 6, '#1a1426'); px(x - 7, y - 6 + f, 14, 14, '#241a36'); px(x - 8, y + 6 + f, 16, 4, '#241a36');
      px(x - 3, y - 9 + f, 2, 1, '#c07ad8'); px(x + 1, y - 9 + f, 2, 1, '#c07ad8');
      px(x - 11, y - 2 + f, 5, 6, '#c8b890'); px(x - 10, y - 1 + f, 1, 4, '#7a3a3a'); break;
    }
    case 'warden': {
      const f = Math.sin(t * 1.5) * 2;
      ctx.globalAlpha = .1; fill('#f5a93a'); ctx.beginPath(); ctx.arc(x, y, 28 * k, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
      px(x - 17 * k, y + 19 * k, 34 * k, 3, 'rgba(0,0,0,.35)');
      px(x - 10 * k, y - 26 * k + f, 20 * k, 10 * k, '#2a2440');
      px(x - 14 * k, y - 16 * k + f, 28 * k, 28 * k, '#3a3258');
      px(x - 18 * k, y + 10 * k + f, 36 * k, 9 * k, '#3a3258');
      px(x - 20 * k, y - 10 * k + f, 6 * k, 18 * k, '#2e2848'); px(x + 14 * k, y - 10 * k + f, 6 * k, 18 * k, '#2e2848');
      px(x - 5 * k, y - 22 * k + f, 3 * k, 2 * k, '#f5a93a'); px(x + 2 * k, y - 22 * k + f, 3 * k, 2 * k, '#f5a93a');
      const cy2 = y - 2 * k + f;
      fill('#e8dcb0'); ctx.beginPath(); ctx.arc(x, cy2, 8 * k, 0, 7); ctx.fill();
      stroke('#3a2a1a'); ctx.lineWidth = 1; ctx.beginPath();
      const a = -t * 2; // hands run backwards
      ctx.moveTo(x, cy2); ctx.lineTo(x + Math.cos(a) * 6 * k, cy2 + Math.sin(a) * 6 * k);
      ctx.moveTo(x, cy2); ctx.lineTo(x + Math.cos(a / 12) * 4 * k, cy2 + Math.sin(a / 12) * 4 * k); ctx.stroke();
      break;
    }
  }
}

function drawNPC(n, t, ox = 0, oy = 0) {
  const x = (n.x * TS) + ox, y = (n.y * TS - 4) + oy;
  switch (n.kind) {
    case 'person': if (!drawWalker(npcSheet(n.look), x, y + 15, n.dir || 'down', false, t)) drawPerson(x, y, { ...LOOKS[n.look], dir: n.dir }); break;
    case 'ghost': {
      ctx.globalAlpha = .55;
      if (!drawWalker(npcSheet('ghost'), x, y + 15 + Math.sin(t * 2) * 1.5, n.dir || 'down', false, t))
        drawPerson(x, y + Math.sin(t * 2) * 1.5, { robe: '#cfe0ff', trim: '#ffffff', hair: '#e8f0ff', skin: '#e8f0ff', dir: n.dir });
      ctx.globalAlpha = 1; break;
    }
    case 'lantern': {
      const glow = S && S.house ? HOUSES[S.house].color : '#f2e6c9';
      const im = IMG['prop_Lantern.png'];
      if (im) { // the HD lantern, with a halo in the colour of your House once you are sorted
        ctx.globalAlpha = .22 + .12 * Math.sin(t * 4); fill(glow); ctx.beginPath(); ctx.arc(x + 8, y + 8, 11, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
        ctx.drawImage(im, x - 8, y - 10, 32, 32);
        break;
      }
      px(x + 7, y - 2, 1, 4, '#8a8a9a'); px(x + 3, y + 2, 10, 2, '#7a6a3a'); px(x + 4, y + 4, 8, 9, '#5a4a2a');
      ctx.globalAlpha = .75 + .25 * Math.sin(t * 4); px(x + 5, y + 5, 6, 7, glow); ctx.globalAlpha = 1;
      px(x + 3, y + 13, 10, 2, '#7a6a3a'); px(x + 3, y + 18, 10, 2, 'rgba(0,0,0,.25)');
      break;
    }
    case 'dummy': drawFoe('dummy', x + 8, y + 6, t, .75); break;
    case 'imps': drawFoe('imp', x + 5, y + 6, t, .75); drawFoe('imp', x + 12, y + 12, t + 1, .75); break;
    case 'warden': drawFoe('warden', x + 8, y + 2, t, .55); break;
  }
}

async function talkHob() {
  if (S.familiar) {
    const f = FAMS[S.familiar];
    await say('Hob', `How is your ${f.name} getting on? It ${f.desc} when you need it most. About every third time you act in a fight, by my count.`, { face: 'happy' });
    return ask('Hob', 'Something else? The roses will not water themselves. Well, three of them will.', [
      { id: 'hob_job', label: 'Ask how long he has kept the grounds.', run: async () => {
        await say('Hob', 'Forty years this winter. I came the same week the Archive was sealed. Funny, that. Nobody else thinks it is funny.');
      } },
      { id: 'hob_loose', ...check('insight', 11, 'Ask what "got loose" on the grounds.'), run: async ok => {
        if (ok) await say('Hob', 'You noticed I keep looking at the Archive windows. Fine. The slimes are not escaping from the potions store. They are coming up out of the old drains under the Library. Something down there is stirring.', { face: 'sad' });
        else await say('Hob', 'Slimes, mostly. Potion spills with ideas above their station. Nothing to worry about.');
      } },
      { id: 'hob_fam', label: `Ask why the ${f.name} chose you.`, run: async () => {
        await say('Hob', 'Familiars choose people they have met before. That is the old saying, anyway. Never made sense to me. Until today.');
      } },
    ], 'Leave him to the roses.');
  }
  await say('Hob', 'Hob. Groundskeeper. Every first-year bonds with a familiar in their first week. You missed the ceremony, being unwritten and all.');
  await say('Hob', 'These four have been waiting by the fountain all morning. They seem to think they know you.');
  const c = await choose(S.name, '(Four small faces turn toward you at once.)', [
    '"They know me? How?"',
    '"I am not sure I am ready to look after anything."',
    check('arcana', 10, 'Feel for the bond between them and you.'),
    houseOpt('thorn', 'Kneel down and let them come to you.'),
  ]);
  if (c === 0) await say('Hob', 'Animals remember things people forget. You could be anyone, to me. To them you are somebody.');
  else if (c === 1) await say('Hob', 'Nobody is. That is rather the point of a familiar. You look after each other, badly, until you get good at it.', { face: 'happy' });
  else if (c === 2) await say(null, rolled ? 'There is a thread already there, thin as cobweb, running from each of them to you. As if you have done this before.' : 'You feel nothing at all. The rabbit sneezes.');
  else { await say(null, 'You kneel in the grass. All four of them crowd into your lap at once. Hob laughs.'); await say('Hob', 'Thornveil. You lot always were good with living things.', { face: 'happy' }); }
  const keys = Object.keys(FAMS);
  const i = await choose('Hob', 'Which one comes to you?', keys.map(k => `${FAMS[k].name}: ${FAMS[k].desc}`));
  S.familiar = keys[i];
  await say(null, `The ${FAMS[S.familiar].name} bonds with you. It will follow you everywhere now, whether you like it or not.`);
  await say('Hob', 'Look after it. It will look after you.', { face: 'happy' });
}

async function talkChef() {
  await say('Madame Pottage', pick([
    'Stew! It is always stew. Today it is stew with a little bit of courage in it.',
    'You look peaky. Sit. Eat. No, I will not say what is in it. Magic, mostly.',
    'The Headmistress takes her tea with seven sugars. Do not tell her I told you. Now, stew.',
  ]));
  const c = await choose(S.name, '(A steaming bowl appears in front of you.)', [
    'Eat the stew.',
    '"What is actually in it?"',
    { ...check('persuasion', 12, '"Could I take some for the road?"'), show: !S.flags.chefPacked },
    '"Have you worked here long?"',
  ]);
  if (c === 1) await say('Madame Pottage', 'Carrots. Courage. A pinch of a dragon\'s good mood. The rest is between me and the pot.');

async function openChest(id) {
  const c = CHESTS[id];
  if (S.chests[id]) return say(null, 'The chest is empty. Someone got here first. You did.');
  S.chests[id] = true;
  if (c.gear) {
    const g = GEAR[c.gear];
    if (!S.bag.includes(c.gear)) S.bag.push(c.gear);
    let msg = `Found ${g.name}! (${gearText(g)})`;
    if (!S.gear[g.slot] || ['novice_wand', 'novice_robe'].includes(S.gear[g.slot])) { S.gear[g.slot] = c.gear; msg += ' You put it on.'; }
    else msg += ' Equip it from the menu.';
    await say(null, msg);
  } else {
    const parts = Object.entries(c.items).map(([k, n]) => { S.items[k] += n; return `${n} ${k === 'tonic' ? 'Moonleaf Tonic' : 'Ether Drop'}${n > 1 ? 's' : ''}`; });
    await say(null, `Found ${parts.join(' and ')}!`);
  }
}

  else if (!S.flags.thorneWarden) {
    S.flags.thorneWarden = true;
    await say('Headmistress Thorne', 'So. You have met the Warden.');
    await say('Headmistress Thorne', 'Some doors in this school were locked by people we have not met yet. I always suspected one of them would come back for theirs.');
  } else await say('Headmistress Thorne', 'Keep rising. I would like to meet the person who locked that door, and I suspect I will have to wait for you to become them.');
  await ask('Headmistress Thorne', 'Was there something else?', [
    { id: 'th_quill', label: 'Ask about the Admissions Quill.', run: async () => {
      await say('Headmistress Thorne', 'It was carved from the first feather of the first owl to nest in the clocktower. Which is odd, because Aldermere has no clocktower.');
    } },

      await say('Headmistress Thorne', 'Magic does not disappear. It gets spent. Whatever you did before you woke up in my courtyard, you spent all of it doing it.', { face: 'sad' });
    } },

      else await say('Headmistress Thorne', 'Knowing more than I tell is in the job description. Run along.');
    } },
  ], 'Thank her and go.');
}

async function sortingCeremony() {
  const tally = { ember: 0, tide: 0, thorn: 0, gale: 0 };
  let last = 'ember';
  const qs = [
    ['A door stands locked before you. What do you do?', ['Burn it down.', 'Study the lock.', 'Wait for a friend with the key.', 'Climb through the window above it.']],
    ['What do you fear most?', ['Being a coward.', 'Being a fool.', 'Being alone.', 'Being ordinary.']],
    ['What would you give to have your memories back?', ['My comfort.', 'My certainty.', 'Nothing that belongs to someone else.', 'Anything at all.']],
  ];
  await say('Oracle Lantern', 'The flame inside the Lantern leans toward you, the way a flower leans toward a window.');
  for (const [q, opts] of qs) {
    const i = await choose('Oracle Lantern', q, opts);
    last = HOUSE_ORDER[i]; tally[last]++;
  }
  const [best, second] = HOUSE_ORDER.slice().sort((a, b) => (tally[b] - tally[a]) || ((b === last) - (a === last)));
  await say('Oracle Lantern', `The flame burns ${HOUSES[best].name} colours... but it flickers, as if it is not quite sure.`);
  const c = await choose(S.name, '(You could let it decide. Or you could ask.)', [
    `Let it choose ${HOUSES[best].name}.`,
    `Ask for ${HOUSES[second].name} instead.`,
  ]);
  if (c === 1) { S.flags.choseHouse = true; await say('Oracle Lantern', 'The flame bends, considers, and turns a new colour. Choosing matters more than being chosen.'); }
  S.house = c === 1 ? second : best;
  await say('Oracle Lantern', `${HOUSES[S.house].name.toUpperCase()}! ${HOUSES[S.house].motto}.`);
}

async function talkBrannoch() {

    await say('Instructor Brannoch', 'Focus draws magic back into you, once you have any to draw. Today you do not.');
    const c = await choose(S.name, '(The dummy turns its head toward you. It should not be able to do that.)', [

    else if (c === 2) await say('Instructor Brannoch', 'About as hard as a disappointed aunt. You will live.');
    else if (c === 3 && rolled) { S.flags.brannochLikes = true; await say('Instructor Brannoch', 'HA! I like you already. Go on then.', { face: 'happy' }); }
    else if (c === 3) await say('Instructor Brannoch', 'Ha. That is what they all say. The dummy has a list.');
    else await say('Instructor Brannoch', 'Off you go.');
    const r = await fight(['dummy'], { noFlee: true });
    if (r !== 'win') return;
    await say('Instructor Brannoch', 'There! Did you feel that? A spark! First time I have ever seen one wake up mid-swing.', { face: 'happy' });
    await say('Instructor Brannoch', 'Now, the Library is west of the courtyard. Quillon has been shouting for help all morning, and you need books more than bruises.');

  ];
  if (S.flags.chapter1) trials.push({ label: 'Trial III: Echo of the Warden', keys: ['echo'], line: 'I bottled an echo of the thing in the Archive. It is not happy about it.' });
  const opts = [...trials.map(t => t.label), { label: 'Talk', show: ['br_brow', 'br_cassius', 'br_loose'].some(id => !S.flags['asked_' + id]) }, 'Not now'];
  const i = await choose('Instructor Brannoch', 'Fancy a Trial? Win and you earn experience. Lose and you earn humility.', opts);
  if (i === trials.length) return ask('Instructor Brannoch', 'Talking, is it? Fine. Quickly.', [
    { id: 'br_brow', label: 'Ask what happened to his eyebrow.', run: async () => {
      await say('Instructor Brannoch', 'A student set it on fire in my first year of teaching. Best student I ever had. She is a dragon tamer now. I am very proud. I am also very bald on one side.');
    } },
    { id: 'br_cassius', label: 'Ask about Cassius Vane.', run: async () => {
      await say('Instructor Brannoch', 'Talented. Angry. His father is a Governor of the school and has never once said "well done". Go easy on the boy. Or do not. He would hate that more.');
    } },
    { id: 'br_loose', ...check('insight', 12, '"You are worried about something on the grounds."'), run: async ok => {
      if (ok) await say('Instructor Brannoch', 'Sharp. Fine. The things out there are not wandering in from the forest. They are coming from under the school, and every week there are more. Something is waking up.', { face: 'sad' });
      else await say('Instructor Brannoch', 'Worried? I am never worried. I am occasionally concerned, loudly.');
    } },
  ], 'Back to training.');
  if (i > trials.length) return say('Instructor Brannoch', 'Suit yourself. The dummy is always here.');
  await say('Instructor Brannoch', trials[i].line);
  const r = await fight(trials[i].keys, {});
  if (r === 'win') {

    if (i === 1 && !S.bag.includes('moon_hat')) { S.bag.push('moon_hat'); await say(null, `Brannoch also hands you a Moonweave Cloak (${gearText(GEAR.moon_hat)}). "Found it in the observatory. Suits you better than the golem."`); }
    if (i === 2 && !S.bag.includes('amethyst_ring')) { S.bag.push('amethyst_ring'); await say(null, `Brannoch presses an Amethyst Ring (${gearText(GEAR.amethyst_ring)}) into your hand. "For surviving that. Barely."`); }
  }
}

async function talkQuillon() {

async function talkMira() {
  if (!S.flags.trained) return say('Mira', 'Sorry, I can\'t talk. I am having a small problem with a book. It is fine. Everything is fine.', { face: 'shocked' });
  await say('Mira', 'Oh, thank goodness, someone with a wand. Don\'t look at me like that. It was ONE page.', { face: 'shocked' });
  await say('Mira', 'They are Inkimps. Pages that bite. They eat punctuation. Help me put them back before they get to the encyclopaedias!');
  const ms = miraStats(miraLv());
  S.mira = { hp: ms.maxhp, mp: ms.maxmp };
  const c = await choose(S.name, '(Ink is dripping from the ceiling.)', [
    '"I will help. Point me at them."',
    '"Pages that bite? Are you serious?"',
    '"What did you do?"',
    check('arcana', 11, 'Look at the spell that held the book shut.'),
  ]);
  if (c === 0) { await say('Mira', 'Oh, I like you. Left flank! Is that a thing? That is a thing. Go!', { face: 'happy' }); approve('Mira', 1); }
  else if (c === 1) await say('Mira', 'Deadly serious. One of them ate every full stop in my essay. It is just one long sentence now and it is AWFUL.');
  else if (c === 2) { await say('Mira', 'I opened a book in a library! That is the whole job of a library!', { face: 'shocked' }); approve('Mira', -1); }
  else if (rolled) { S.flags.miraInnocent = true; await say(null, 'The binding has been torn from the inside. Mira did not open this book. Something inside it wanted out.'); await say('Mira', 'You can see that? It wasn\'t me! I told Quillon it wasn\'t me!', { face: 'happy' }); approve('Mira', 2); }
  else await say(null, 'The spell is a tangle of ink and panic. You cannot make sense of it.');
  S.flags.mira = true;
  await say(null, 'Mira joins your party!');
  const r = await fight(['inkimp', 'inkimp'], { noFlee: true });
  if (r !== 'win') { S.flags.mira = false; S.mira = null; return; }
  await say('Mira', 'Mira Fenwick. Tidewyrm, second year. And you are the Unwritten Student, aren\'t you? Everyone is talking about you.', { face: 'happy' });
  await ask('Mira', 'Sorry. I talk a lot when I am nervous. Ask me something. Anything.', [
    { id: 'mi_quill', label: 'Ask about the Admissions Quill.', run: async () => {
      await say('Mira', 'I have read every record in this library about it. It has never added a name. Not once in six hundred years.');
      await say('Mira', 'Except there is one place I have never been able to read. The Forbidden Archive, behind the seal at the north wall.');
    } },
    { id: 'mi_self', label: '"Tell me about yourself."', run: async () => {
      await say('Mira', 'I want to be the Archivist one day. The person who knows where every book is, and every secret in them. Also I like soup. That is less ambitious.', { face: 'happy' });
    } },
    { id: 'mi_why', ...check('insight', 12, '"Why were you really reading the Bestiary?"'), run: async ok => {
      if (ok) {
        S.flags.miraDream = true;
        await say('Mira', '...I have dreamt about this school since I was six. A tower with a clock that runs backwards. Someone calling my name from the top of it.', { face: 'sad' });
        await say('Mira', 'The Bestiary mentions a clocktower. Nobody else has ever heard of one. I thought I was going mad. You do not look at me like I am mad.');
        approve('Mira', 2);
      } else await say('Mira', 'For research! I am always reading for research. That is what research is.');
    } },
  ], '"We should get moving."');
  await say('Mira', 'Seals answer to strong magic. Reach Adept rank and I bet it will at least look at you. I am coming too. For research.', { face: 'happy' });
  await say('Mira', 'Oh, and when we are both ready at the same moment, we can weave our spells together. Look for Tech in battle.');
  await say(null, 'You can talk to Mira any time from the menu.');
  setGoal(S.lv >= 5 ? 'Examine the Archive seal at the north wall of the Library.' : 'Train to Adept rank (Lv 5): fight on the Training Grounds, then examine the Library seal.');
}

// Talking to Mira from the pause menu: a few conversations unlock as the story moves on, like talking at camp.
function miraTopics() {
  return [
    { id: 'mc_term', label: '"How are you finding the term?"', run: async () => {
      await say('Mira', 'Busy. Strange. Better since you turned up. Everything was very quiet before. I did not know I minded until it stopped.', { face: 'happy' });
    } },
    { id: 'mc_family', label: 'Ask about her family.', run: async () => {
      await say('Mira', 'Fenwicks are all librarians and lighthouse keepers. People who keep things safe in the dark. I am the first one with a wand that works. Mostly.');
      const c = await choose(S.name, '(She is twisting the end of her scarf.)', ['"They must be proud."', '"Mostly?"', check('persuasion', 11, '"You are braver than you think, Mira."')]);
      if (c === 0) await say('Mira', 'They are. Loudly. In letters. Every week.', { face: 'happy' });
      else if (c === 1) await say('Mira', 'It caught fire once. Only once. I do not want to talk about it.');
      else if (rolled) { await say('Mira', '...You keep saying things like that as if you have known me for years. I like it. Please keep doing it.', { face: 'happy' }); approve('Mira', 2); }

    } },
    { id: 'mc_tower', ...memoryOpt(4, 'Tell her about the clocktower you remember.'), run: async () => {
      await say('Mira', 'A clocktower? Hands running backwards? ...That is my dream. That is MY dream. How are you in my dream?', { face: 'shocked' });
      await say('Mira', 'Okay. Okay. Either we are both mad or we are both right. I would rather be right with you than mad on my own.');
      approve('Mira', 2);
    } },
    { id: 'mc_scared', label: '"Are you scared of what is in the Archive?"', show: !!S.flags.archiveOpen && !S.flags.chapter1, run: async () => {
      await say('Mira', 'Terrified. But it said welcome BACK. To you. Whatever is in there has been waiting for you, and I want to know why. Being scared has never stopped me reading anything.');
    } },
    { id: 'mc_future', label: '"The Warden said I came from forty years ahead."', show: !!S.flags.chapter1, run: async () => {
      await say('Mira', 'I have been thinking about that. If you came back, something must have gone very wrong up there. In the future. Do you think... was I there?', { face: 'sad' });
      const c = await choose(S.name, '(She is looking at you very carefully.)', [
        '"I think so. And I think I am here to fix it."',
        '"I do not know yet."',
        memoryOpt(9, '"There was a woman with red hair. In the frozen second. I did not reach her."'),
      ]);
      if (c === 0) { await say('Mira', 'Then we fix it together. Partners. No more coming back alone.', { face: 'happy' }); approve('Mira', 1); }
      else if (c === 1) await say('Mira', 'That is alright. Not knowing is where all the best research starts.');
      else { await say('Mira', '...Red hair. A Tidewyrm scarf.', { face: 'shocked' }); await say('Mira', 'Then this time, reach me. Promise.', { face: 'sad' }); approve('Mira', 3); }
    } },
  ];
}
async function talkToMira() {
  const left = miraTopics().filter(t => t.show !== false && !S.flags['asked_' + t.id]);
  if (!left.length) return say('Mira', fond('Mira') ? 'I am all talked out. But I am glad you asked. Ask me again when something dramatic happens. It will.' : 'Nothing new to report. Ask me again after something dramatic happens.');
  await ask('Mira', fond('Mira') ? 'Oh! Hello. I was just thinking about you. About the case, I mean. What is it?' : 'What is it?', left, '"Never mind."');
}

async function gateScript() {
  if (S.flags.archiveOpen) return;
  if (!S.flags.mira) return say(null, 'A great seal of interlocking circles. It is cold, and it does not care that you are here.');
  if (S.lv < 5) {
    await say(null, 'The seal stirs under your hand, then goes still, as if it is waiting for you to grow into something.');
    await say('Mira', 'It moved! It has never moved for anyone! Reach Adept rank and try again.', { face: 'shocked' });
    return;
  }
  await say(null, 'You press your palm to the seal. The circles turn, click by click, like a lock remembering its key.');
  await say('???', '...Welcome back.');
  const c = await choose(S.name, '(The voice came from inside the stone.)', [
    '"...Hello?"',
    check('arcana', 12, 'Read the magic woven through the seal.'),
    '"Mira, get behind me."',
    memoryOpt(7, '"I made you. I remember the wax."'),
  ]);
  if (c === 0) await say('???', 'Hello, yourself. You took your time. Or rather, you have not taken it yet.');
  else if (c === 1) await say(null, rolled ? 'The seal is keyed to a single magical signature. Yours. Older and stronger, but unmistakably yours.' : 'The magic is too old and too deep to read. It feels like looking down a well.');
  else if (c === 2) { await say('Mira', 'Behind you? I am the one with the spells! ...But thank you.', { face: 'happy' }); approve('Mira', 1); }
  else await say('???', 'Then you remember the promise. Come up. I have kept it safe.');
  await say('Mira', 'Did the door just say welcome BACK?', { face: 'shocked' });
  S.flags.archiveOpen = true;
  setGoal('Explore the Forbidden Archive. Something waits at the top. Magus rank (Lv 7) is wise.');
}

async function talkWarden() {
  await say('The Hollow Warden', 'Footsteps. After forty years, footsteps.');
  await say('The Hollow Warden', 'And yours, of all the footsteps in the world. You are early. You are so very early.');
  const c = await choose(S.name, '(The clock in its chest ticks backwards. What do you say?)', [
    '"Who are you?"',
    '"Do you know me?"',
    check('insight', 13, '"You do not want to fight me. You want to test me."'),
    memoryOpt(7, '"I left you here. I remember the wax and the starlight."'),
    '"Stand aside."',
  ]);
  let soft = false;
  if (c === 0) await say('The Hollow Warden', 'I am the Warden. I keep what you left here.');
  else if (c === 1) await say('The Hollow Warden', 'Better than you know yourself. That is the problem.');
  else if (c === 2 && rolled) { soft = true; await say('The Hollow Warden', 'Clever. Yes. A test. I will hold back a little, but only a little. You made me promise to be hard on you.'); }
  else if (c === 2) await say('The Hollow Warden', 'Wrong. I want to see you bleed a little. You would understand, if you remembered.');
  else if (c === 3) { soft = true; await say(null, 'The Warden bows, very low, chains chiming.'); await say('The Hollow Warden', 'Then you remember the bargain. Good. I will still fight you. You made me swear it. But I will remember that you remembered.'); }
  else await say('The Hollow Warden', 'You said exactly that, last time. The words were braver when you had magic behind them.');
  await say('The Hollow Warden', 'I do not hand it back to anyone who is not ready. Show me what you are now.');
  const base = FOES.warden.hp;
  if (soft) FOES.warden.hp = Math.round(base * .8);
  let r;
  try { r = await fight(['warden'], { noFlee: true }); } finally { FOES.warden.hp = base; }
  if (r !== 'win') return;
  await say('The Hollow Warden', 'Enough. Enough. You are sharper than I expected.');
  await say('The Hollow Warden', 'Listen, then. The Quill wrote your name because you asked it to. You asked it forty years from now, as Archwizard of Aldermere.');
  await say('The Hollow Warden', 'You stepped backwards through time. The crossing took your memories as its toll. You knew it would, and you came anyway.');
  await say('The Hollow Warden', 'They are not destroyed. They return as your power returns. Rise to Archwizard and you will remember why you came.');

// ---------------------------------------------------------------- field
function loadMap(id, x, y, dir) {
  MAPID = id; MAP = MAPS[id];
  P = { x, y, tx: x, ty: y, dir: dir || 'down', moving: false, prog: 0, step: 0, hist: [[x, y, dir || 'down'], [x, y, dir || 'down'], [x, y, dir || 'down']] };
  S.map = id; S.x = x; S.y = y; S.dir = P.dir;
  mode = 'explore';
  spawnField();
  updateCamera();
}
function spawnField() {
  FIELD = [];
  const cfg = MAP.foes && MAP.foes();
  if (!cfg) return;
  cfg.spots.forEach(([x, y]) => {
    const group = pick(cfg.groups);
    FIELD.push({ x, y, tx: x, ty: y, hx: x, hy: y, prog: 0, moving: false, timer: rnd(.4, 1.4), group, art: FOES[group[0]].art });
  });
}
async function enterMap(id, x, y, dir) {
  lock++;
  try {
    await fadeOut();
    loadMap(id, x, y, dir);
    await sleep(60);
    await fadeIn();
    toast(MAP.name);
    save();
    if (MAP.onEnter) await MAP.onEnter();
  } finally { lock--; }
}
const STEP = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
function walkable(x, y, forFoe) {
  if (x < 0 || y < 0 || x >= mapW() || y >= mapH()) return false;
  const c = tileAt(x, y);
  if (c === 'g') { if (!S.flags.archiveOpen) return false; }
  else if (SOLID.has(c)) return false;
  if (npcAt(x, y) || propAt(x, y)) return false;
  if (forFoe) {
    if (MAP.exits.some(e => e.x === x && e.y === y)) return false;
    if (FIELD.some(f => (f.x === x && f.y === y) || (f.tx === x && f.ty === y))) return false;
  }
  return true;
}
function pPos() { return [(P.x + (P.tx - P.x) * P.prog) * TS, (P.y + (P.ty - P.y) * P.prog) * TS]; }
function fPos(f) { return [(f.x + (f.tx - f.x) * f.prog) * TS, (f.y + (f.ty - f.y) * f.prog) * TS]; }
function updateCamera() {
  const [ppx, ppy] = pPos(), mw = mapW() * TS, mh = mapH() * TS;
  cam.x = mw <= W ? -(W - mw) / 2 : clamp(ppx + 8 - W / 2, 0, mw - W);
  cam.y = mh <= H ? -(H - mh) / 2 : clamp(ppy + 8 - H / 2, 0, mh - H);
}

function updateExplore(dt) {
  const frozen = lock > 0 || handlers.length > 0;
  if (P.moving) {
    P.prog += dt * 5.5;
    if (P.prog >= 1) { P.x = P.tx; P.y = P.ty; P.moving = false; P.prog = 0; S.x = P.x; S.y = P.y; S.dir = P.dir; onArrive(); }
  }
  if (!P.moving && !frozen) {
    const d = curDir();
    if (d) {
      P.dir = d;
      const nx = P.x + STEP[d][0], ny = P.y + STEP[d][1];
      if (walkable(nx, ny)) { P.hist.unshift([P.x, P.y, d]); P.hist.length = 3; P.tx = nx; P.ty = ny; P.moving = true; P.prog = 0; P.step ^= 1; }
    }
  }
  updateCamera();
  if (frozen || lock > 0) return; // lock may have been taken this frame by an exit
  grace -= dt;
  for (const f of FIELD) {
    if (f.moving) { f.prog += dt * 2.6; if (f.prog >= 1) { f.x = f.tx; f.y = f.ty; f.moving = false; f.prog = 0; } continue; }
    f.timer -= dt; if (f.timer > 0) continue;
    f.timer = rnd(.5, 1.5);
    let d;
    const dx = P.x - f.x, dy = P.y - f.y;
    if (Math.abs(dx) + Math.abs(dy) < 5 && Math.random() < .55) d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    else d = pick(DIRS);
    const nx = f.x + STEP[d][0], ny = f.y + STEP[d][1];
    if (Math.abs(nx - f.hx) + Math.abs(ny - f.hy) <= 4 && walkable(nx, ny, true)) { f.tx = nx; f.ty = ny; f.moving = true; f.prog = 0; }
  }
  if (grace <= 0) {
    const [ppx, ppy] = pPos();
    const hit = FIELD.find(f => { const [fx, fy] = fPos(f); return Math.hypot(fx - ppx, fy - ppy) < 12; });
    if (hit) encounter(hit);
  }
}
async function encounter(f) {
  FIELD = FIELD.filter(o => o !== f);
  if (P.moving) { P.x = P.tx; P.y = P.ty; P.moving = false; P.prog = 0; }
  await fight(f.group, {});
  grace = 1.5;
}
function onArrive() {
  const e = MAP.exits.find(e => e.x === P.x && e.y === P.y && (!e.cond || e.cond()));
  if (e) enterMap(e.to, e.tx, e.ty, P.dir);
}
function exploreAction(a) {
  if (a === 'cancel' || a === 'menu') { openPause(); return; }
  if (a !== 'ok' || P.moving) return;
  const fx = P.x + STEP[P.dir][0], fy = P.y + STEP[P.dir][1];
  const n = npcAt(fx, fy);
  if (n) {
    if (n.dir) n.dir = { up: 'down', down: 'up', left: 'right', right: 'left' }[P.dir];
    run(n.talk); return;
  }
  const o = propAt(fx, fy);
  if (o && o.talk) { run(o.talk); return; }
  if (o) { run(() => say(null, { Nightstand: 'A nightstand with a candle stub and a very overdue library book.', Study_Chair: 'A wobbly chair. It has carved initials on the back: yours, but older.', Potion_Shelf: 'Rows of bubbling bottles. One is labelled DO NOT. Another is labelled DEFINITELY DO NOT.', Cauldron: 'Something in the cauldron blinks at you.' }[o.p] || 'Nothing interesting.')); return; }
  const c = tileAt(fx, fy);
  if (c === 'g') run(gateScript);
  else if (c === 'f') run(async () => { restoreParty(); await say(null, 'You drink from the fountain. The water tastes of rain and copper. You feel completely restored.'); });
  else if (c === 'B' && LORE[MAPID]) run(() => say(null, pick(LORE[MAPID])));
  else if (c === '~') run(() => say(null, 'Something large croaks beneath the surface, then thinks better of it.'));
  else if (c === 'w') run(() => say(null, 'Through the glass you can see the far towers. One of them has a clock. You are sure it was not there a moment ago.'));
  else if (c === 'K') run(() => say(null, 'Petals drift down from the blossom tree and settle on your sleeve. They smell like the first day of something.'));
}

function updateBattle(dt) {
  B.t += dt;
  B.fx = B.fx.filter(f => B.t - f.t0 < f.dur);
  if (B.over || B.busy || B.menu) return;
  B.queue = B.queue.filter(p => p.hp > 0);
  if (B.queue.length) { openCommand(B.queue[0]); return; }
  for (const c of [...B.party, ...B.foes]) {
    if (c.hp <= 0) continue;
    c.atb = Math.min(100, c.atb + c.spd * (c.haste ? 1.6 : 1) * dt * 7);
    if (c.atb >= 100) {
      if (c.ally) { if (!B.queue.includes(c)) B.queue.push(c); }
      else { B.busy = true; foeAct(c).then(afterAction); return; }
    }
  }
}
function afterAction() {
  if (!B || B.over) return;
  B.busy = false;
  if (B.foes.every(f => f.hp <= 0)) endBattle('win');
  else if (B.party.every(p => p.hp <= 0)) endBattle('lose');
}
async function endBattle(r) {
  B.over = true;
  B.actor = null; B.cursor = null; canvasPick = null;
  $('cmdlist').innerHTML = ''; $('cmdtitle').textContent = '';
  if (r === 'win') { banner('Victory!', 1100); await sleep(1100); }
  else if (r === 'lose') { banner('Your party has fallen...', 1300); await sleep(1300); }
  const hero = B.party.find(p => p.id === 'hero'), mira = B.party.find(p => p.id === 'mira');
  S.hp = Math.max(1, hero.hp); S.mp = hero.mp;
  if (mira) { S.mira.hp = Math.max(1, mira.hp); S.mira.mp = mira.mp; }
  const xp = B.foes.reduce((a, f) => a + f.xp, 0);
  const drops = { tonic: 0, ether: 0 };
  if (r === 'win') B.foes.forEach(() => { if (Math.random() < .25) drops.tonic++; if (Math.random() < .1) drops.ether++; });
  const res = B.res;
  B = null; mode = 'explore';
  $('battle').hidden = true; $('banner').hidden = true;
  res({ r, xp, drops });
}

function openCommand(a) {

function techReady() {

  return h && m && h.hp > 0 && m.hp > 0 && h.atb >= 100 && m.atb >= 100 && h.mp >= 4 && m.mp >= 4 && S.lv >= 2;

async function commandFlow(a) {
  while (true) {

      { label: 'Attack' },
      { label: 'Magic', dis: !a.spells.length },
      ...(S.mira ? [{ label: 'Tech', sub: S.house ? HOUSES[S.house].tech : '', dis: !techReady() }] : []),

    $('cmdtitle').textContent = a.name;
    const i = await menu($('cmdlist'), cmds);
    if (i < 0) { if (B.queue.length > 1) { B.queue.push(B.queue.shift()); return; } continue; }
    const c = cmds[i].label;
    if (c === 'Attack') { const t = await pickTarget(aliveFoes()); if (!t) continue; await doAttack(a, t); }
    else if (c === 'Magic') {
      $('cmdtitle').textContent = `${a.name}: Magic`;
      const list = a.spells.map(k => ({ label: SPELLS[k].name, icon: spellIcon(k), sub: `${SPELLS[k].mp}`, dis: a.mp < SPELLS[k].mp || (SPELLS[k].tgt === 'other' && !aliveParty().some(p => p !== a)) }));
      const j = await menu($('cmdlist'), list);
      if (j < 0) continue;
      const sp = SPELLS[a.spells[j]];

const STARS = Array.from({ length: 120 }, () => [Math.random() * W, Math.random() * 180, Math.random()]);

function drawFxSprite(f, p) {

}
function renderFx() {

function drawCombatant(c) {
