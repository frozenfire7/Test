<title>Aldermere Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* Layout: one centered game stage (320x224 canvas, pixel-scaled) with time-travel-era blue windows overlaid; touch pad below on phones.
   Single deliberate night palette: the academy after dark, ivory-edged windows, candle gold. */
:root {
  --night: #0c0d1e;
  --ink: #ece6d3;
  --win-top: #3341a6;
  --win-bot: #131a5c;
  --edge: #efe5c8;
  --gold: #e6c36c;
  --dim: #9ca2cc;
  --hp: #86e39a;
  --mp: #86bfff;
  --atb: #f0d35e;
  --danger: #ff8270;
  --memory-top: #3d2b60;
  --memory-bot: #170f30;
  --ui: 'Pixelify Sans', 'Courier New', monospace;
  --display: 'Cinzel Decorative', 'Palatino Linotype', Georgia, serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { height: 100%; background: var(--night); font-variant-ligatures: none; font-feature-settings: "liga" 0, "clig" 0; }
body {
  margin: 0; min-height: 100%; box-sizing: border-box;
  background: var(--night); color: var(--ink); font-family: var(--ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}
#stage {
  position: relative; width: min(100%, 960px, calc((100vh - 64px) * 320 / 224));
  aspect-ratio: 320 / 224; max-width: 100%;
  container-type: inline-size; background: #000;
  border: 2px solid #272c5c; border-radius: 6px; overflow: hidden;
  user-select: none; -webkit-user-select: none; touch-action: none;
}
canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
.ov { position: absolute; }
.win {
  background: linear-gradient(180deg, var(--win-top), var(--win-bot));
  border: 2px solid var(--edge); border-radius: 5px;
  box-shadow: 0 0 0 2px #0a0d33, inset 0 0 0 1px rgba(255,255,255,.14);
  color: #fff; text-shadow: 1px 1px 0 rgba(0,0,0,.6);
}
.opt { position: relative; display: flex; justify-content: space-between; gap: 1em; padding: .1em .35em .1em 1.25em; border-radius: 3px; cursor: pointer; }
.opt.sel { background: rgba(255,255,255,.12); }
.opt.sel::before { content: '\25B8'; position: absolute; left: .3em; color: var(--gold); }
.opt.dis { opacity: .42; cursor: default; }
.opt .sub { color: var(--mp); font-variant-numeric: tabular-nums; }

#fade { inset: 0; background: #000; opacity: 0; transition: opacity .4s; pointer-events: none; }
#fade.on { opacity: 1; }

#goal {
  top: 2%; left: 2%; max-width: 58%; padding: .35em .7em; font-size: clamp(10px, 1.9cqw, 16px); line-height: 1.3;
  background: rgba(14, 18, 66, .82); border-width: 1px; display: flex; flex-direction: column; gap: .1em;
}
#goal b { color: var(--gold); font-weight: 600; letter-spacing: .04em; }
#toast {
  top: 14%; left: 50%; transform: translateX(-50%); white-space: nowrap; pointer-events: none;
  font-family: var(--display); font-size: clamp(15px, 3.8cqw, 34px); color: var(--gold);
  text-shadow: 0 2px 0 #000, 0 0 12px rgba(0,0,0,.8); opacity: 0; transition: opacity .6s;
}
#toast.on { opacity: 1; }
#banner { top: 3%; left: 50%; transform: translateX(-50%); padding: .2em 1.1em; font-size: clamp(12px, 2.6cqw, 22px); white-space: nowrap; }

#battle {
  left: 1.5%; right: 1.5%; bottom: 2%; max-height: 42%;
  display: grid; grid-template-columns: minmax(0, 34%) minmax(0, 1fr); gap: 1cqw;
  font-size: clamp(11px, 2.3cqw, 20px); line-height: 1.3;
}
#cmds { padding: .45em .5em; overflow: auto; min-width: 0; }
#cmdtitle { color: var(--gold); font-size: .85em; margin: 0 0 .15em .3em; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#party { padding: .45em .7em; display: flex; flex-direction: column; justify-content: center; gap: .4em; min-width: 0; }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto 22%; gap: .8em; align-items: center; font-variant-numeric: tabular-nums; }
.prow .pn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .lbl { color: var(--dim); font-size: .8em; margin-right: .25em; }
.prow.active .pn { color: var(--gold); }
.prow.ko { color: var(--danger); }
.atb { height: .55em; background: #0a0d33; border: 1px solid #c9c9e2; border-radius: 2px; overflow: hidden; }
.atb i { display: block; height: 100%; width: 0; background: var(--atb); }
.prow.ready .atb i { background: #fff7c8; box-shadow: 0 0 6px #fff; }

#dialog {
  left: 2%; right: 2%; bottom: 3%; min-height: 24%; box-sizing: border-box;
  padding: 1.8cqw 2.6cqw 2.2cqw; font-size: clamp(12px, 2.7cqw, 24px); line-height: 1.38; cursor: pointer;
}
#dialog.memory { background: linear-gradient(180deg, var(--memory-top), var(--memory-bot)); font-style: italic; }
#dialog.memory #who { color: #d9c4ff; }
#who { color: var(--gold); font-weight: 600; margin-bottom: .2em; letter-spacing: .03em; font-style: normal; }
#say { max-width: 70ch; }
#choices { margin-top: .4em; }
#more { position: absolute; right: 1.6cqw; bottom: .8cqw; color: var(--gold); animation: bob .8s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(3px); } }

#title { inset: 0; display: flex; flex-direction: column; align-items: center; padding-top: 7cqw; gap: 1.2cqw; text-align: center; }
#title h1 {
  margin: 0; font-family: var(--display); font-size: clamp(28px, 8.4cqw, 80px); line-height: 1; color: var(--gold);
  letter-spacing: .03em; text-wrap: balance; text-shadow: 0 3px 0 #2e2108, 0 0 22px rgba(230,195,108,.35);
}
#title .sub { font-size: clamp(11px, 2.5cqw, 22px); letter-spacing: .32em; text-transform: uppercase; color: var(--ink); }
#titlebox { margin-top: 1.8cqw; padding: .6em .9em; min-width: 38cqw; font-size: clamp(12px, 2.6cqw, 22px); text-align: left; }

#namebox { inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(4,5,18,.55); }
#nameform { width: min(88%, 520px); padding: 2cqw 3cqw; display: flex; flex-direction: column; gap: 1.2cqw; font-size: clamp(13px, 2.6cqw, 22px); }
#nameform label { line-height: 1.35; }
#nameinput { font: inherit; background: #0a0d33; color: #fff; border: 2px solid var(--edge); border-radius: 3px; padding: .3em .5em; }
#nameinput:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.act { align-self: flex-end; font: inherit; font-weight: 600; background: var(--gold); color: #1b1432; border: 0; border-radius: 3px; padding: .35em 1em; cursor: pointer; }

#pause { inset: 3%; padding: 1.6cqw 2cqw; overflow: auto; font-size: clamp(11px, 2.1cqw, 18px); line-height: 1.35; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2cqw; align-items: start; }
#pause h3 { margin: 0 0 .25em; font-size: .85em; color: var(--gold); letter-spacing: .12em; text-transform: uppercase; font-weight: 600; }
#pause section { margin-bottom: .9em; }
#pause .pc { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 0 1em; margin-bottom: .5em; font-variant-numeric: tabular-nums; }
#pause .pc .nm { color: #fff; font-weight: 600; }
#pause .pc .dim, #pause .dim { color: var(--dim); }
#pause ul { margin: 0; padding-left: 1.1em; }
#pause li { margin-bottom: .25em; }
#pausemenu { min-width: 9em; position: sticky; top: 0; }
@container (max-width: 540px) { #pause { grid-template-columns: 1fr; } #pausemenu { position: static; order: -1; } }

#card { inset: 0; background: rgba(4,4,14,.9); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2cqw; text-align: center; padding: 4cqw; }
#card h2 { margin: 0; font-family: var(--display); color: var(--gold); font-size: clamp(22px, 6cqw, 56px); text-wrap: balance; }
#card p { margin: 0; max-width: 52ch; font-size: clamp(12px, 2.4cqw, 20px); line-height: 1.45; }
#cardmenu { padding: .4em .8em; font-size: clamp(12px, 2.4cqw, 20px); margin-top: 1cqw; }

#pad { width: min(100%, 520px); display: flex; justify-content: space-between; align-items: center; gap: 16px; touch-action: none; user-select: none; -webkit-user-select: none; }
#pad button { font: 600 16px var(--ui); color: #fff; background: linear-gradient(180deg, #2c3896, #151b5e); border: 2px solid var(--edge); border-radius: 10px; touch-action: none; }
#pad button:active, #pad button.down { background: #3d4cc0; }
.dpad { display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); gap: 4px; }
.dpad [data-a="up"] { grid-area: 1 / 2; } .dpad [data-a="left"] { grid-area: 2 / 1; }
.dpad [data-a="right"] { grid-area: 2 / 3; } .dpad [data-a="down"] { grid-area: 3 / 2; }
.abtns { display: flex; align-items: center; gap: 10px; }
.abtns [data-a="ok"], .abtns [data-a="cancel"] { width: 60px; height: 60px; border-radius: 50%; }
.abtns [data-a="ok"] { background: linear-gradient(180deg, #b8892e, #7a5414); }
.abtns [data-a="menu"] { padding: 8px 12px; font-size: 13px; }
#help { color: var(--dim); font-size: 13px; text-align: center; max-width: 70ch; line-height: 1.5; }
#help kbd { font-family: var(--ui); color: var(--ink); border: 1px solid #3a3f70; border-radius: 3px; padding: 0 .35em; }
@media (hover: hover) and (pointer: fine) { #pad { display: none; } }
@media (hover: none), (pointer: coarse) { #help { display: none; } }
@media (prefers-reduced-motion: reduce) { #more { animation: none; } #fade, #toast { transition: none; } }
</style>

<div id="stage">
  <canvas id="cv" width="640" height="448"></canvas>
  <div id="fade" class="ov"></div>
  <div id="goal" class="ov win" hidden></div>
  <div id="toast" class="ov"></div>
  <div id="banner" class="ov win" hidden></div>
  <div id="battle" class="ov" hidden>
    <div id="cmds" class="win"><div id="cmdtitle"></div><div id="cmdlist"></div></div>
    <div id="party" class="win"></div>
  </div>
  <div id="dialog" class="ov win" hidden>
    <div id="who"></div>
    <div id="say"></div>
    <div id="choices"></div>
    <div id="more" hidden>&#9660;</div>
  </div>
  <div id="pause" class="ov win" hidden><div id="pausebody"></div><div id="pausemenu"></div></div>
  <div id="card" class="ov" hidden><h2 id="cardtitle"></h2><div id="cardtext"></div><div id="cardmenu" class="win"></div></div>
  <div id="namebox" class="ov" hidden>
    <form id="nameform" class="win" autocomplete="off">
      <label for="nameinput">Your name is the only thing you remember. What is it?</label>
      <input id="nameinput" maxlength="12" placeholder="Rowan" spellcheck="false">
      <button class="act" type="submit">Wake up</button>
    </form>
  </div>
  <div id="title" class="ov">
    <h1>Aldermere</h1>
    <div class="sub">The Unwritten Student</div>
    <div id="titlebox" class="win"><div id="titlemenu"></div></div>
  </div>
</div>

<div id="pad" aria-label="Touch controls">
  <div class="dpad">
    <button data-a="up" aria-label="Up">&#9650;</button>
    <button data-a="left" aria-label="Left">&#9664;</button>
    <button data-a="right" aria-label="Right">&#9654;</button>
    <button data-a="down" aria-label="Down">&#9660;</button>
  </div>
  <div class="abtns">
    <button data-a="menu">Menu</button>
    <button data-a="cancel" aria-label="Back">B</button>
    <button data-a="ok" aria-label="Confirm">A</button>
  </div>
</div>
<p id="help"><kbd>Arrows</kbd>/<kbd>WASD</kbd> move &middot; <kbd>Z</kbd>/<kbd>Enter</kbd> talk and confirm &middot; <kbd>X</kbd>/<kbd>Esc</kbd> back and open the menu. Battle gauges pause while you choose a command.</p>

<script>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const W = 320, H = 224, TS = 16, DPR = 2; // world logic in 320x224; canvas backs it at 2x so HD sprites keep their detail
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------------------------------------------------------------- data
const HOUSES = {
  ember: { name: 'Emberhold', color: '#d4553a', elem: 'fire', motto: 'Courage that burns', spells: ['ember', 'fireball'], tech: 'Steam Burst' },

const SPELLS = {
  ember:     { name: 'Ember', mp: 2, pow: 14, elem: 'fire', tgt: 'one' },
  lash:      { name: 'Tidal Lash', mp: 2, pow: 14, elem: 'water', tgt: 'one' },
  thorn:     { name: 'Thornwhip', mp: 2, pow: 14, elem: 'earth', tgt: 'one' },

const MAXLV = 12;

  2: 'A word rises out of the dark, warm as a coal. The first spell you ever learned. You have learned it before.',

  5: 'Your own voice, older and tired: "If this works, you will arrive with nothing. Not even your name. Do it anyway."',
  7: 'Wax and starlight. Your palm pressing a seal into a door, and a hooded giant bowing low. "I will keep it until you return."',
  9: 'A battlefield where every second has frozen solid. A woman with red hair and a Tidewyrm scarf stands in the last one. You did not reach her in time.',

};

  const h = HOUSES[house || 'ember'], s = [];
  if (lv >= 2) s.push(h.spells[0]);
  if (lv >= 3) s.push('mend');

  if (lv >= 9) s.push('chrono');

  return s;
}

const heroStats = lv => ({ maxhp: 42 + 11 * (lv - 1), maxmp: lv === 1 ? 0 : 8 + 5 * (lv - 1), atk: 6 + 2 * (lv - 1), mag: Math.round(3 + 3.4 * (lv - 1)), def: Math.round(3 + 1.5 * (lv - 1)), spd: 8 + .4 * (lv - 1) });

};

// ---------------------------------------------------------------- maps (20 x 14 tiles)
const MAPS = {

const KEYMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  KeyZ: 'ok', Enter: 'ok', Space: 'ok', KeyX: 'cancel', Escape: 'cancel', Backspace: 'cancel', KeyM: 'menu' };
const DIRS = ['up', 'down', 'left', 'right'];
const dirStack = [];
function emit(a) {
  if (handlers.length) { handlers[handlers.length - 1](a); return; }
  if (mode === 'explore' && lock === 0) exploreAction(a);
}
addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  const a = KEYMAP[e.code]; if (!a) return;
  e.preventDefault();
  if (DIRS.includes(a)) { if (!dirStack.includes(a)) dirStack.push(a); emit(a); }
  else if (!e.repeat) emit(a);
});
addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (a && DIRS.includes(a)) { const i = dirStack.indexOf(a); if (i >= 0) dirStack.splice(i, 1); } });
addEventListener('blur', () => { dirStack.length = 0; });

  b.addEventListener('pointerdown', e => { e.preventDefault(); b.classList.add('down'); if (DIRS.includes(a) && !dirStack.includes(a)) dirStack.push(a); emit(a); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => b.addEventListener(ev, up));
  b.addEventListener('contextmenu', e => e.preventDefault());
});

// ---------------------------------------------------------------- UI helpers
function menu(el, items, { start = 0, noCancel = false, onMove } = {}) {
  return new Promise(res => {
    el.innerHTML = '';
    let sel = items.findIndex((it, i) => i >= start && !it.dis);
    if (sel < 0) sel = Math.max(0, items.findIndex(it => !it.dis));
    const nodes = items.map((it, i) => {
      const d = document.createElement('div');
      d.className = 'opt' + (it.dis ? ' dis' : '');
      d.innerHTML = `<span>${esc(it.label)}</span>` + (it.sub ? `<span class="sub">${esc(it.sub)}</span>` : '');
      d.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (it.dis) return; sel = i; draw(); done(i); });
      el.appendChild(d); return d;
    });
    function draw() {
      nodes.forEach((n, i) => n.classList.toggle('sel', i === sel));
      const n = nodes[sel], sc = el.closest('#cmds') || el;
      if (n && sc.scrollHeight > sc.clientHeight) {
        if (n.offsetTop < sc.scrollTop) sc.scrollTop = n.offsetTop;
        else if (n.offsetTop + n.offsetHeight > sc.scrollTop + sc.clientHeight) sc.scrollTop = n.offsetTop + n.offsetHeight - sc.clientHeight;
      }
      if (onMove) onMove(sel);
    }
    function done(v) { pop(h); res(v); }
    const h = a => {
      if (!items.length) { if (a === 'cancel' && !noCancel) done(-1); return; }
      if (a === 'up' || a === 'left') { sel = (sel - 1 + items.length) % items.length; draw(); }
      else if (a === 'down' || a === 'right') { sel = (sel + 1) % items.length; draw(); }
      else if (a === 'ok') { if (!items[sel].dis) done(sel); }
      else if (a === 'cancel' && !noCancel) done(-1);
    };
    push(h); draw();
  });
}

function typeText(who, text, memory) {
  return new Promise(res => {
    const box = $('dialog');
    box.hidden = false; box.classList.toggle('memory', !!memory);
    $('who').textContent = who || ''; $('who').hidden = !who;
    $('choices').innerHTML = ''; $('more').hidden = true;
    const body = $('say');
    let i = 0, timer = null;
    const finish = () => { clearInterval(timer); body.textContent = text; pop(h); box.onpointerdown = null; res(); };
    const h = a => { if (a === 'ok' || a === 'cancel') finish(); };
    push(h);
    box.onpointerdown = e => { e.preventDefault(); finish(); };
    if (reduceMotion) { finish(); return; }
    body.textContent = '';
    timer = setInterval(() => { i += 2; body.textContent = text.slice(0, i); if (i >= text.length) finish(); }, 18);
  });
}
function waitOk() {
  return new Promise(res => {
    const box = $('dialog');
    const fin = () => { pop(h); box.onpointerdown = null; res(); };
    const h = a => { if (a === 'ok' || a === 'cancel') fin(); };
    push(h); box.onpointerdown = e => { e.preventDefault(); fin(); };
  });
}
async function say(who, text, o = {}) {
  await typeText(who, text, o.memory);
  $('more').hidden = false;
  await waitOk();
  $('dialog').hidden = true;
}
async function choose(who, text, options) {
  await typeText(who, text);
  const i = await menu($('choices'), options.map(l => ({ label: l })), { noCancel: true });
  $('dialog').hidden = true;
  return i;
}

async function fadeIn() { $('fade').classList.remove('on'); await sleep(reduceMotion ? 60 : 420); }

// ---------------------------------------------------------------- drawing primitives
function px(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function hash(a, b) { let h = (a * 374761393 + b * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
const tileAt = (x, y) => (MAP && y >= 0 && y < 14 && x >= 0 && x < 20) ? MAP.rows[y][x] : '#';

function drawTile(X, Y, t) {
  const c = tileAt(X, Y), x = X * TS, y = Y * TS, h = hash(X, Y);
  const floor = () => { px(x, y, 16, 16, '#545a76'); px(x, y + 15, 16, 1, '#454a64'); px(x + 15, y, 1, 16, '#454a64'); if (h > .7) px(x + 4, y + 6, 3, 1, '#61688c'); };
  const grass = () => { px(x, y, 16, 16, '#3d7140'); if (h > .45) { px(x + (h * 13 | 0), y + ((h * 97) % 12 | 0), 1, 2, '#5a9a4a'); px(x + ((h * 53) % 13 | 0), y + ((h * 31) % 13 | 0), 1, 2, '#2e5a32'); } };
  switch (c) {
    case ',': grass(); break;
    case 'p': px(x, y, 16, 16, '#b19866'); px(x + (h * 14 | 0), y + ((h * 71) % 14 | 0), 2, 1, '#957d54'); if (h > .6) px(x + ((h * 37) % 13 | 0), y + ((h * 19) % 13 | 0), 1, 1, '#cbb380'); break;
    case '.': floor(); break;
    case '=': {
      px(x, y, 16, 16, '#7a2234');
      if (tileAt(X - 1, Y) !== '=') px(x, y, 1, 16, '#d2a84a');
      if (tileAt(X + 1, Y) !== '=') px(x + 15, y, 1, 16, '#d2a84a');
      if (tileAt(X, Y - 1) !== '=') px(x, y, 16, 1, '#d2a84a');
      px(x + 7, y + 7, 2, 2, '#963848'); break;
    }
    case '#': case 'w': {
      px(x, y, 16, 16, '#2c3050');
      for (let r = 0; r < 4; r++) { px(x, y + r * 4, 16, 1, '#3a3f66'); const off = r % 2 ? 4 : 0; for (let k = 0; k < 2; k++) px(x + off + k * 8, y + r * 4 + 1, 1, 3, '#20233d'); }
      if (c === 'w') {
        const glow = 0.75 + 0.25 * Math.sin(t * 3 + X);
        px(x + 4, y + 3, 8, 11, '#181a30');
        ctx.globalAlpha = glow; px(x + 5, y + 5, 6, 8, '#f2c86a'); px(x + 6, y + 4, 4, 1, '#f2c86a'); ctx.globalAlpha = 1;
        px(x + 7, y + 4, 2, 9, '#181a30'); px(x + 5, y + 8, 6, 1, '#181a30');
      }
      break;
    }
    case 'T': grass(); px(x + 6, y + 10, 4, 6, '#5a3a22'); px(x + 2, y + 1, 12, 10, '#21502c'); px(x + 1, y + 3, 14, 6, '#21502c'); px(x + 4, y + 2, 4, 3, '#2f6a3a'); px(x + 9, y + 5, 3, 2, '#2a5e34'); break;
    case '~': { px(x, y, 16, 16, '#2a5a9a'); const o = (t * 8 + X * 4) % 16 | 0; px(x + o, y + 5, 4, 1, '#5a8ad0'); px(x + (o + 8) % 16, y + 11, 4, 1, '#5a8ad0'); break; }
    case 'f': {
      px(x, y, 16, 16, '#9a9ab4'); px(x + 2, y + 2, 12, 12, '#3a6ab0');
      if (tileAt(X - 1, Y) === 'f') px(x, y + 2, 2, 12, '#3a6ab0');
      if (tileAt(X + 1, Y) === 'f') px(x + 14, y + 2, 2, 12, '#3a6ab0');
      if (tileAt(X, Y - 1) === 'f') px(x + 2, y, 12, 2, '#3a6ab0');
      if (tileAt(X, Y + 1) === 'f') px(x + 2, y + 14, 12, 2, '#3a6ab0');
      const s = Math.sin(t * 3 + X * 2 + Y);
      px(x + 7 + s * 3, y + 6 + Math.cos(t * 2 + X) * 2, 2, 2, '#d8eeff');
      break;
    }
    case 'B': {
      px(x, y, 16, 16, '#4a2e1e');
      const cols = ['#8a2a2a', '#2a5a8a', '#3a6a3a', '#a08a3a', '#5a3a7a'];
      for (let r = 0; r < 3; r++) { for (let i = 0; i < 7; i++) px(x + 1 + i * 2, y + 1 + r * 5, 2, 4, cols[((h * 100 | 0) + i * 7 + r * 3) % 5]); px(x, y + 5 + r * 5, 16, 1, '#2e1a10'); }
      break;
    }
    case 't': floor(); px(x, y + 3, 16, 9, '#7a4e2a'); px(x, y + 3, 16, 2, '#9a6a3a'); px(x, y + 12, 16, 1, '#3a2414'); if (h > .55) { px(x + 7, y + 1, 2, 3, '#f0e6c8'); px(x + 7, y - 1 + Math.sin(t * 9 + X) * .6, 2, 2, '#ffcf5a'); } break;
    case 'c': {
      if (MAPID === 'archive') px(x, y, 16, 16, '#1e1a2c'); else floor();
      const fl = Math.sin(t * 10 + X) > 0 ? 0 : 1;
      px(x + 4, y + 5, 8, 11, '#7a7e98'); px(x + 3, y + 3, 10, 3, '#9a9eb8');
      px(x + 5, y - 1 + fl, 6, 4, '#ff9a3a'); px(x + 6, y + fl, 4, 3, '#ffe07a'); break;
    }
    case 'd': px(x, y, 16, 16, '#3a2a20'); px(x + 1, y + 1, 14, 15, '#6a4628'); px(x + 7, y + 1, 2, 15, '#4a301a'); px(x + 5, y + 8, 1, 2, '#d2a84a'); px(x + 10, y + 8, 1, 2, '#d2a84a'); break;
    case 'g': {
      if (S.flags.archiveOpen) { px(x, y, 16, 16, '#1e1a2c'); ctx.globalAlpha = .4; px(x + 6, y + 6, 4, 4, '#b88aff'); ctx.globalAlpha = 1; break; }
      px(x, y, 16, 16, '#24163a'); px(x + 1, y + 1, 14, 14, '#36225a');
      const glow = `rgba(190,150,255,${0.45 + 0.35 * Math.sin(t * 2)})`;
      const side = tileAt(X + 1, Y) === 'g' ? 1 : -1;
      ctx.strokeStyle = glow; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x + (side > 0 ? 16 : 0), y + 8, 6, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(x + (side > 0 ? 16 : 0), y + 8, 3, 0, Math.PI * 2); ctx.stroke();
      break;
    }
    case 'x': px(x, y, 16, 16, '#1e1a2c'); px(x, y + 15, 16, 1, '#16131f'); px(x + 15, y, 1, 16, '#16131f'); if (h > .8) px(x + 5, y + 5, 2, 2, '#2a2440'); break;
    case 'X': px(x, y, 16, 16, '#120f1c'); for (let r = 0; r < 4; r++) px(x, y + r * 4, 16, 1, '#1c1830'); break;
    default: px(x, y, 16, 16, '#000');
  }
}

function drawPerson(x, y, o) {
  x = Math.round(x); y = Math.round(y);
  const { robe, trim, hair, skin, dir = 'down', step = 0, hat } = o;
  px(x + 3, y + 14, 10, 2, 'rgba(0,0,0,.3)');
  if (step) { px(x + 5, y + 12, 2, 3, '#1a1420'); px(x + 9, y + 13, 2, 2, '#1a1420'); }
  else { px(x + 5, y + 13, 2, 2, '#1a1420'); px(x + 9, y + 13, 2, 2, '#1a1420'); }
  px(x + 4, y + 8, 8, 5, robe); px(x + 3, y + 10, 10, 3, robe);
  px(x + 5, y + 8, 6, 1, trim);
  if (dir === 'down') px(x + 7, y + 9, 2, 3, trim);
  if (dir === 'left') px(x + 2, y + 9, 2, 2, skin);
  if (dir === 'right') px(x + 12, y + 9, 2, 2, skin);
  px(x + 5, y + 3, 6, 5, skin);
  px(x + 4, y + 2, 8, 2, hair);
  if (dir === 'up') px(x + 4, y + 2, 8, 6, hair);
  else if (dir === 'left') { px(x + 9, y + 3, 3, 4, hair); px(x + 6, y + 5, 1, 1, '#1a1420'); }
  else if (dir === 'right') { px(x + 4, y + 3, 3, 4, hair); px(x + 9, y + 5, 1, 1, '#1a1420'); }
  else { px(x + 4, y + 3, 1, 3, hair); px(x + 11, y + 3, 1, 3, hair); px(x + 6, y + 5, 1, 1, '#1a1420'); px(x + 9, y + 5, 1, 1, '#1a1420'); }
  if (hat) { px(x + 3, y + 2, 10, 1, hat); px(x + 5, y, 6, 2, hat); px(x + 6, y - 2, 4, 2, hat); px(x + 8, y - 4, 2, 2, hat); }
}

function tintScarf(hex) {
  const c = document.createElement('canvas'); c.width = heroImg.width; c.height = heroImg.height;
  const g = c.getContext('2d'); g.drawImage(heroImg, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height), p = d.data;
  const tr = parseInt(hex.slice(1, 3), 16), tg = parseInt(hex.slice(3, 5), 16), tb = parseInt(hex.slice(5, 7), 16);
  for (let i = 0; i < p.length; i += 4) {
    const r = p[i], gg = p[i + 1], b = p[i + 2];
    if (p[i + 3] && r > 90 && r > gg * 1.7 && r > b * 1.7) {
      const l = .3 + .9 * (r / 255);
      p[i] = Math.min(255, tr * l); p[i + 1] = Math.min(255, tg * l); p[i + 2] = Math.min(255, tb * l);
    }
  }
  g.putImageData(d, 0, 0);
  return c;
}
// x is the left edge of the hero's tile; feetY is where the feet touch the ground (logical pixels).
function drawHero(x, feetY, dir, moving, t) {
  const sheet = heroSheets[S && S.house ? S.house : 'none'];
  if (!sheet) return false;
  const col = moving ? 2 + (Math.floor(t * 8) % 4) : Math.floor(t * 2) % 2;
  px(x + 2, feetY - 1, 12, 2, 'rgba(0,0,0,.3)');
  ctx.drawImage(sheet, col * HERO_FRAME, HERO_ROW[dir] * HERO_FRAME, HERO_FRAME, HERO_FRAME, Math.round(x - 8), Math.round(feetY - 31), 32, 32);
  return true;
}

function drawFoe(art, cx, cy, t, k = 1) {
  const x = Math.round(cx), y = Math.round(cy);
  switch (art) {
    case 'dummy':
      px(x - 4, y + 9, 8, 2, 'rgba(0,0,0,.3)'); px(x - 1, y - 2, 2, 12, '#7a5a32'); px(x - 6, y - 1, 12, 2, '#7a5a32');
      px(x - 4, y - 9, 8, 8, '#d8c07a'); px(x - 3, y - 8, 6, 6, '#c0453a'); px(x - 2, y - 7, 4, 4, '#f0e6c8'); px(x - 1, y - 6, 2, 2, '#c0453a'); break;
    case 'imp': {
      const b = Math.sin(t * 6 + x) * 1.5;
      px(x - 6, y + 9, 12, 2, 'rgba(0,0,0,.3)');
      px(x - 6, y - 4 + b, 12, 10, '#1c1830'); px(x - 5, y - 6 + b, 10, 2, '#1c1830'); px(x - 6, y - 8 + b, 2, 3, '#1c1830'); px(x + 4, y - 8 + b, 2, 3, '#1c1830');
      px(x - 3, y - 2 + b, 2, 2, '#ffea6a'); px(x + 1, y - 2 + b, 2, 2, '#ffea6a'); px(x - 2, y + 2 + b, 4, 1, '#c04a6a');
      px(x - 7, y + 6, 4, 2, '#1c1830'); px(x + 3, y + 6, 4, 2, '#1c1830'); break;
    }
    case 'broom': {
      const a = Math.sin(t * 5 + x) * 2;
      px(x - 5, y + 11, 10, 2, 'rgba(0,0,0,.3)');
      px(x - 1 + a * .4, y - 11, 2, 14, '#9a6a3a'); px(x - 5, y + 2, 10, 3, '#c8a04a'); px(x - 6, y + 5, 12, 5, '#e0c060');
      px(x - 6, y + 9, 2, 2, '#e0c060'); px(x + 4, y + 9, 2, 2, '#e0c060'); px(x - 2, y + 3, 1, 1, '#222'); px(x + 1, y + 3, 1, 1, '#222'); break;
    }
    case 'wisp': {
      const r = 5 + Math.sin(t * 4 + x);
      ctx.fillStyle = 'rgba(150,120,230,.25)'; ctx.beginPath(); ctx.arc(x, y, r + 4, 0, 7); ctx.fill();
      ctx.fillStyle = '#3a2a6a'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
      px(x - 3, y - 1, 2, 2, '#c8f0ff'); px(x + 1, y - 1, 2, 2, '#c8f0ff'); px(x - 1, y + r - 1, 2, 4, '#3a2a6a'); break;
    }
    case 'toad':
      px(x - 8, y + 8, 16, 2, 'rgba(0,0,0,.3)');
      px(x - 8, y - 2, 16, 9, '#4a7a3a'); px(x - 6, y - 6, 4, 4, '#4a7a3a'); px(x + 2, y - 6, 4, 4, '#4a7a3a');
      px(x - 5, y - 5, 2, 2, '#ffe060'); px(x + 3, y - 5, 2, 2, '#ffe060'); px(x - 6, y + 3, 12, 3, '#9ac06a');
      px(x - 9, y + 6, 4, 2, '#3a6a2a'); px(x + 5, y + 6, 4, 2, '#3a6a2a'); break;
    case 'gargoyle': {
      const w = Math.sin(t * 3) * 2;
      px(x - 9, y + 11, 18, 2, 'rgba(0,0,0,.35)');
      px(x - 14, y - 8 + w, 7, 8, '#5a5e6a'); px(x + 7, y - 8 + w, 7, 8, '#5a5e6a');
      px(x - 7, y - 10, 14, 18, '#7a7e8a'); px(x - 6, y - 14, 4, 4, '#7a7e8a'); px(x + 2, y - 14, 4, 4, '#7a7e8a');
      px(x - 4, y - 6, 3, 2, '#ff5a3a'); px(x + 1, y - 6, 3, 2, '#ff5a3a'); px(x - 3, y - 1, 6, 2, '#4a4e5a');
      px(x - 8, y + 8, 6, 3, '#5a5e6a'); px(x + 2, y + 8, 6, 3, '#5a5e6a'); break;
    }
    case 'shade': {
      const f = Math.sin(t * 2 + x) * 1.5;
      px(x - 6, y - 12 + f, 12, 6, '#1a1426'); px(x - 7, y - 6 + f, 14, 14, '#241a36'); px(x - 8, y + 6 + f, 16, 4, '#241a36');
      px(x - 3, y - 9 + f, 2, 1, '#b88aff'); px(x + 1, y - 9 + f, 2, 1, '#b88aff');
      px(x - 11, y - 2 + f, 5, 6, '#c8b890'); px(x - 10, y - 1 + f, 1, 4, '#7a3a3a'); break;
    }
    case 'warden': {
      const f = Math.sin(t * 1.5) * 2;
      ctx.fillStyle = 'rgba(255,220,140,.10)'; ctx.beginPath(); ctx.arc(x, y, 28 * k, 0, 7); ctx.fill();
      px(x - 17 * k, y + 19 * k, 34 * k, 3, 'rgba(0,0,0,.35)');
      px(x - 10 * k, y - 26 * k + f, 20 * k, 10 * k, '#2a2440');
      px(x - 14 * k, y - 16 * k + f, 28 * k, 28 * k, '#3a3258');
      px(x - 18 * k, y + 10 * k + f, 36 * k, 9 * k, '#3a3258');
      px(x - 20 * k, y - 10 * k + f, 6 * k, 18 * k, '#2e2848'); px(x + 14 * k, y - 10 * k + f, 6 * k, 18 * k, '#2e2848');
      px(x - 5 * k, y - 22 * k + f, 3 * k, 2 * k, '#ffd27a'); px(x + 2 * k, y - 22 * k + f, 3 * k, 2 * k, '#ffd27a');
      const cy2 = y - 2 * k + f;
      ctx.fillStyle = '#e8dcb0'; ctx.beginPath(); ctx.arc(x, cy2, 8 * k, 0, 7); ctx.fill();
      ctx.strokeStyle = '#3a2a1a'; ctx.lineWidth = 1; ctx.beginPath();
      const a = -t * 2; // hands run backwards
      ctx.moveTo(x, cy2); ctx.lineTo(x + Math.cos(a) * 6 * k, cy2 + Math.sin(a) * 6 * k);
      ctx.moveTo(x, cy2); ctx.lineTo(x + Math.cos(a / 12) * 4 * k, cy2 + Math.sin(a / 12) * 4 * k); ctx.stroke();
      break;
    }
  }
}

function drawNPC(n, t) {
  const x = n.x * TS, y = n.y * TS - 4;
  switch (n.kind) {
    case 'person': drawPerson(x, y, { ...LOOKS[n.look], dir: n.dir }); break;
    case 'ghost': ctx.globalAlpha = .5; drawPerson(x, y + Math.sin(t * 2) * 1.5, { robe: '#cfe0ff', trim: '#ffffff', hair: '#e8f0ff', skin: '#e8f0ff', dir: n.dir }); ctx.globalAlpha = 1; break;
    case 'lantern': {
      const glow = S.house ? HOUSES[S.house].color : '#ffe9a8';
      px(x + 7, y - 2, 1, 4, '#8a8a9a'); px(x + 3, y + 2, 10, 2, '#7a6a3a'); px(x + 4, y + 4, 8, 9, '#5a4a2a');
      ctx.globalAlpha = .75 + .25 * Math.sin(t * 4); px(x + 5, y + 5, 6, 7, glow); ctx.globalAlpha = 1;
      px(x + 3, y + 13, 10, 2, '#7a6a3a'); px(x + 3, y + 18, 10, 2, 'rgba(0,0,0,.25)');
      break;
    }
    case 'dummy': drawFoe('dummy', x + 8, y + 6, t); break;
    case 'imps': drawFoe('imp', x + 5, y + 6, t); drawFoe('imp', x + 12, y + 12, t + 1); break;
    case 'warden': drawFoe('warden', x + 8, y + 2, t, .55); break;
  }
}

async function talkThorne() {
  if (!S.flags.sorted) {
    await say('Headmistress Thorne', 'Ah. The one the Quill wrote about.');
    await say('Headmistress Thorne', 'Every summer the Admissions Quill writes the names of the children Aldermere will teach. This morning it wrote one more name, after the list was sealed.');

    await say('Headmistress Thorne', c === 0 ? 'No. I don\'t suppose you do.' : 'Haven\'t you? The fountain seemed to know you. It splashed.');

async function sortingCeremony() {
  const tally = { ember: 0, tide: 0, thorn: 0, gale: 0 };
  let last = 'ember';
  const qs = [
    ['A door stands locked before you. What do you do?', ['Burn it down.', 'Study the lock.', 'Wait for a friend with the key.', 'Climb through the window above it.']],
    ['What do you fear most?', ['Being a coward.', 'Being a fool.', 'Being alone.', 'Being ordinary.']],
    ['What would you give to have your memories back?', ['My comfort.', 'My certainty.', 'Nothing that belongs to someone else.', 'Anything at all.']],
  ];
  await say('Oracle Lantern', 'The flame inside the Lantern leans toward you, the way a flower leans toward a window.');
  for (const [q, opts] of qs) {
    const i = await choose('Oracle Lantern', q, opts);
    last = HOUSE_ORDER[i]; tally[last]++;
  }
  const best = HOUSE_ORDER.slice().sort((a, b) => (tally[b] - tally[a]) || ((b === last) - (a === last)))[0];
  S.house = best;
  await say('Oracle Lantern', `${HOUSES[best].name.toUpperCase()}! ${HOUSES[best].motto}.`);
}

}

async function talkBrannoch() {

    await say('Instructor Brannoch', 'Focus draws magic back into you, once you have any to draw. Today you do not. Off you go.');
    const r = await fight(['dummy'], { noFlee: true });
    if (r !== 'win') return;
    await say('Instructor Brannoch', 'There! Did you feel that? A spark! First time I have ever seen one wake up mid-swing.');
    await say('Instructor Brannoch', 'Now, the Library is west of the courtyard. Quillon has been shouting for help all morning, and you need books more than bruises.');
    await say('Instructor Brannoch', 'Come back any time for a Trial. And watch the grass out there. Things have got loose.');
    S.flags.trained = true;
    setGoal('Answer the call for help in the Library (west of the courtyard).');
    spawnField();
    return;
  }
  const trials = [
    { label: 'Trial I: Unruly Pack', keys: ['inkimp', 'broom', 'inkimp'], line: 'Brooms and imps. Mind your ankles.' },
    { label: 'Trial II: Stone and Gloom', keys: ['gargoyle', 'wisp'], line: 'A gargoyle off the east roof and its gloomy little friend. Bring Mira.' },
  ];
  if (S.flags.chapter1) trials.push({ label: 'Trial III: Echo of the Warden', keys: ['echo'], line: 'I bottled an echo of the thing in the Archive. It is not happy about it.' });

}

async function talkQuillon() {

  }

async function talkMira() {
  if (!S.flags.trained) return say('Mira', 'Sorry, I can\'t talk. I am having a small problem with a book. It is fine. Everything is fine.');
  await say('Mira', 'Oh, thank goodness, someone with a wand. Don\'t look at me like that. It was ONE page.');
  await say('Mira', 'They are Inkimps. They eat punctuation. Help me put them back before they get to the encyclopaedias!');
  const ms = miraStats(miraLv());
  S.mira = { hp: ms.maxhp, mp: ms.maxmp };
  S.flags.mira = true;
  await say(null, 'Mira joins your party!');

  await say('Mira', 'Except there is one place I have never been able to read. The Forbidden Archive, behind the seal at the north wall.');
  await say('Mira', 'Seals answer to strong magic. Reach Adept rank and I bet it will at least look at you. I am coming too. For research.');

async function gateScript() {
  if (S.flags.archiveOpen) return;
  if (!S.flags.mira) return say(null, 'A great seal of interlocking circles. It is cold, and it does not care that you are here.');
  if (S.lv < 5) {
    await say(null, 'The seal stirs under your hand, then goes still, as if it is waiting for you to grow into something.');
    await say('Mira', 'It moved! It has never moved for anyone! Reach Adept rank and try again.');
    return;
  }
  await say(null, 'You press your palm to the seal. The circles turn, click by click, like a lock remembering its key.');
  await say('???', '...Welcome back.');
  await say('Mira', 'Did the door just say welcome BACK?');
  S.flags.archiveOpen = true;
  setGoal('Explore the Forbidden Archive. Something waits at the top. Magus rank (Lv 7) is wise.');
}

async function talkWarden() {
  await say('The Hollow Warden', 'Footsteps. After forty years, footsteps.');
  await say('The Hollow Warden', 'And yours, of all the footsteps in the world. You are early. You are so very early.');
  const c = await choose(S.name, '(What do you say?)', ['Who are you?', 'Do you know me?']);

// ---------------------------------------------------------------- field
function loadMap(id, x, y, dir) {
  MAPID = id; MAP = MAPS[id];
  P = { x, y, tx: x, ty: y, dir: dir || 'down', moving: false, prog: 0, step: 0 };
  S.map = id; S.x = x; S.y = y; S.dir = P.dir;
  mode = 'explore';
  spawnField();
}
function spawnField() {
  FIELD = [];
  const cfg = MAP.foes && MAP.foes();
  if (!cfg) return;
  cfg.spots.forEach(([x, y]) => {
    const group = pick(cfg.groups);
    FIELD.push({ x, y, tx: x, ty: y, hx: x, hy: y, prog: 0, moving: false, timer: rnd(.4, 1.4), group, art: FOES[group[0]].art });
  });
}
async function enterMap(id, x, y, dir) {
  lock++;
  try {
    await fadeOut();
    loadMap(id, x, y, dir);
    await sleep(60);
    await fadeIn();
    toast(MAP.name);

async function rewards(xp, drops) {
  const parts = [`Victory! ${xp} XP.`];
  if (drops.tonic) parts.push(`Found ${drops.tonic} Moonleaf Tonic${drops.tonic > 1 ? 's' : ''}.`);
  if (drops.ether) parts.push(`Found ${drops.ether} Ether Drop${drops.ether > 1 ? 's' : ''}.`);
  S.items.tonic += drops.tonic; S.items.ether += drops.ether;
  await say(null, parts.join(' '));
  if (S.lv >= MAXLV) return;
  S.xp += xp;
  while (S.lv < MAXLV && S.xp >= XP[S.lv + 1]) {
    const before = heroSpells(S.lv, S.house), oldRank = rankOf(S.lv);
    S.lv++;
    restoreParty();
    const learned = heroSpells(S.lv, S.house).filter(k => !before.includes(k));
    let msg = `${S.name} reached Level ${S.lv}!`;
    if (learned.length) msg += ` Learned ${learned.map(k => SPELLS[k].name).join(' and ')}.`;
    await say(null, msg);
    if (rankOf(S.lv) !== oldRank) await say(null, `New rank: ${rankOf(S.lv)}.`);
    if (MEMORIES[S.lv] && !S.memories.includes(S.lv)) { S.memories.push(S.lv); await say('A memory returns', MEMORIES[S.lv], { memory: true }); }
    if (S.lv === 5 && S.flags.mira && !S.flags.archiveOpen) setGoal('Examine the Archive seal at the north wall of the Library.');
    if (S.lv === MAXLV && !S.flags.archwizard) { S.flags.archwizard = true; setGoal('You are an Archwizard. Wander Aldermere as long as you like.'); await finale(); }
  }
}
async function defeat() {
  await fadeOut();
  restoreParty();
  loadMap('courtyard', 9, 9, 'up');
  await fadeIn();
  await say('Nurse Hollis', 'Back with us? Someone carried you out in a heap. It happens to every first-year at least once.');
  await say('Nurse Hollis', 'You are patched up. Try not to do it again before lunch. The fountain is there if you need it.');
}

// ---------------------------------------------------------------- render
const STARS = Array.from({ length: 80 }, () => [Math.random() * W, Math.random() * 150, Math.random()]);
function drawTitle(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#060716'); g.addColorStop(1, '#1d1e4a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  STARS.forEach(([x, y, b]) => { const a = .3 + .7 * Math.abs(Math.sin(t * (.4 + b) + x)); ctx.fillStyle = `rgba(255,248,225,${a * .85})`; ctx.fillRect(x | 0, y | 0, 1, 1); });
  ctx.fillStyle = '#f3ecd0'; ctx.beginPath(); ctx.arc(268, 38, 13, 0, 7); ctx.fill();
  ctx.fillStyle = '#0a0b20'; ctx.beginPath(); ctx.arc(274, 34, 12, 0, 7); ctx.fill();
  const towers = [[26, 128, 22], [64, 140, 30], [112, 104, 26], [160, 78, 18], [206, 112, 28], [252, 134, 34], [296, 124, 20]];
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 176, W, 48);
  towers.forEach(([x, y, w]) => {
    ctx.fillRect(x - w / 2, y, w, H - y);
    ctx.beginPath(); ctx.moveTo(x - w / 2 - 3, y); ctx.lineTo(x, y - w * .9); ctx.lineTo(x + w / 2 + 3, y); ctx.fill();
  });
  towers.forEach(([x, y, w], i) => {
    for (let r = 0; r < 3; r++) for (let c = 0; c < 2; c++) {
      const on = Math.sin(t * .7 + i * 3 + r * 5 + c) > -.2;
      if (!on) continue;
      ctx.fillStyle = 'rgba(242,200,106,.85)'; ctx.fillRect(x - w / 4 + c * (w / 2) - 1, y + 14 + r * 16, 2, 4);
    }
    ctx.fillStyle = '#0a0a1a';
  });
  const cx = 160, cy = 90;
  ctx.fillStyle = '#e8dcb0'; ctx.beginPath(); ctx.arc(cx, cy, 6, 0, 7); ctx.fill();
  ctx.strokeStyle = '#2a1e10'; ctx.lineWidth = 1; ctx.beginPath(); const a = -t * 1.4;
  ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * 5, cy + Math.sin(a) * 5); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a / 12) * 3, cy + Math.sin(a / 12) * 3); ctx.stroke();
}
function renderFx() {
  for (const f of B.fx) {
    const p = Math.min(1, (B.t - f.t0) / f.dur);
    if (f.type === 'proj') {
      const x = f.x0 + (f.x1 - f.x0) * p, y = f.y0 + (f.y1 - f.y0) * p - Math.sin(p * Math.PI) * 10;
      px(x - 2, y - 2, 4, 4, f.color); ctx.globalAlpha = .5; px(x - (f.x1 - f.x0) * .06 - 1, y - 1, 2, 2, f.color); ctx.globalAlpha = 1;
    } else if (f.type === 'burst') {
      ctx.globalAlpha = 1 - p; ctx.strokeStyle = f.color; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(f.x, f.y, 3 + p * 12, 0, 7); ctx.stroke();
      for (let i = 0; i < 6; i++) { const a = i * 1.047; px(f.x + Math.cos(a) * p * 14, f.y + Math.sin(a) * p * 14, 2, 2, f.color); }
      ctx.globalAlpha = 1;
    } else if (f.type === 'ring') {
      ctx.globalAlpha = 1 - p; ctx.strokeStyle = f.color; ctx.beginPath(); ctx.arc(f.x, f.y, 4 + p * 10, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
    } else if (f.type === 'spark') {
      ctx.globalAlpha = 1 - p;
      for (let i = 0; i < 7; i++) px(f.x + Math.cos(i * 2.4) * 7, f.y + 6 - p * 18 - (i % 3) * 3, 1, 2, f.color);
      ctx.globalAlpha = 1;
    } else if (f.type === 'num') {
      const y = f.y - Math.min(1, p * 3) * 6;
      ctx.globalAlpha = p > .75 ? (1 - p) * 4 : 1;
      ctx.font = '600 10px "Pixelify Sans", monospace'; ctx.textAlign = 'center';
      ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.strokeText(f.text, f.x, y); ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, y);
      ctx.globalAlpha = 1;
    }
  }
}
function drawCombatant(c) {
  if (c.hp <= 0 && !c.ally) {
    if (c.deadT == null) return;
    const p = (B.t - c.deadT) / .5; if (p >= 1) return; ctx.globalAlpha = 1 - p;
  }
  if (c.flash != null && B.t - c.flash < .3 && ((B.t * 30) | 0) % 2 === 0) { ctx.globalAlpha = 1; return; }
  let ox = 0;
  if (c.lungeT != null) { const p = (B.t - c.lungeT) / .3; if (p < 1) ox = Math.sin(p * Math.PI) * 18 * (c.ally ? -1 : 1); }
  if (c.ally) {
    const look = c.id === 'hero' ? heroLook() : LOOKS.mira;
    if (c.hp <= 0) { px(c.bx - 8, c.by + 2, 12, 5, look.robe); px(c.bx + 3, c.by + 1, 5, 5, look.skin); px(c.bx + 4, c.by, 5, 2, look.hair); }
    else if (!(c.id === 'hero' && drawHero(c.bx - 8 + ox, c.by + 5, 'left', c.atb >= 100 || ox !== 0, B.t)))
      drawPerson(c.bx - 8 + ox, c.by - 10, { ...look, dir: 'left', step: c.atb >= 100 ? ((B.t * 4) | 0) % 2 : 0 });
  } else drawFoe(c.art, c.bx + ox, c.by, B.t, c.key === 'echo' ? .75 : 1);
  ctx.globalAlpha = 1;
}
function drawCursor(c) {
  const bob = Math.sin(B.t * 8) * 1.5;
  const top = c.ally ? c.by - 18 : c.by - (c.art === 'warden' ? (c.key === 'echo' ? 30 : 38) : 20);
  ctx.fillStyle = '#e6c36c';
  ctx.beginPath(); ctx.moveTo(c.bx - 4, top - 6 + bob); ctx.lineTo(c.bx + 4, top - 6 + bob); ctx.lineTo(c.bx, top + bob); ctx.fill();
  if (!c.ally) { px(c.bx - 12, c.by + 16, 24, 3, '#0a0d33'); px(c.bx - 12, c.by + 16, 24 * c.hp / c.maxhp, 3, c.hp / c.maxhp > .35 ? '#86e39a' : '#ff8270'); }
}
function render(t) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = false;
  if (mode === 'title' || !MAP) { drawTitle(t); return; }
  for (let y = 0; y < 14; y++) for (let x = 0; x < 20; x++) drawTile(x, y, t);
  const ents = visibleNPCs().map(n => ({ y: n.y * TS, draw: () => drawNPC(n, t) }));
  if (mode !== 'battle') {
    FIELD.forEach(f => { const [fx2, fy2] = fPos(f); ents.push({ y: fy2, draw: () => drawFoe(f.art, fx2 + 8, fy2 + 6, t, .5) }); });
    const [ppx, ppy] = pPos();
    ents.push({ y: ppy, draw: () => drawHero(ppx, ppy + 12, P.dir, P.moving, t) || drawPerson(ppx, ppy - 4, { ...heroLook(), dir: P.dir, step: P.moving ? P.step : 0 }) });
  }
  ents.sort((a, b) => a.y - b.y).forEach(e => e.draw());
  if (MAP.dark) {
    let lx = 160, ly = 100, r1 = 150;
    if (mode !== 'battle') { const [ppx, ppy] = pPos(); lx = ppx + 8; ly = ppy + 6; r1 = 92; }
    const g = ctx.createRadialGradient(lx, ly, 18, lx, ly, r1);
    g.addColorStop(0, 'rgba(6,4,16,0)'); g.addColorStop(1, 'rgba(6,4,16,.86)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (mode === 'battle' && B) {
    ctx.fillStyle = 'rgba(8,8,28,.42)'; ctx.fillRect(0, 0, W, H);
    [...B.foes, ...B.party].sort((a, b) => a.by - b.by).forEach(drawCombatant);
    if (B.cursor) drawCursor(B.cursor);
    renderFx();
    updatePartyPanel();
  }
}

// ---------------------------------------------------------------- flow
function askName() {
  return new Promise(res => {
    const box = $('namebox'), inp = $('nameinput');
    box.hidden = false; inp.value = '';
    setTimeout(() => inp.focus(), 60);
    const block = () => {};
    push(block);
    $('nameform').onsubmit = e => {
      e.preventDefault();
      const v = (inp.value || '').trim().replace(/\s+/g, ' ').slice(0, 12) || 'Rowan';
      pop(block); box.hidden = true; inp.blur(); res(v);
    };
  });
}
async function newGame() {
  const name = await askName();
  S = newState(name);
  $('fade').classList.add('on');
  $('title').hidden = true;
  lock++;
  await sleep(350);
  await say(null, 'Cold stone under your cheek. Somewhere above you, a bell is ringing nine.');
  await say(null, 'You try to remember how you got here. There is nothing there. No home. No face. No yesterday.');
  await say(null, `Only a name, ${name}. Even that feels borrowed.`);
  loadMap('courtyard', 9, 9, 'up');
  await fadeIn();
  toast(MAP.name);
  await sleep(900);
  await say(name, '...Where am I?');
  await say('Prefect Aldous', 'You! Yes, you, lying on the flagstones. Up you get. Orientation started ten minutes ago. Great Hall, north doors. Go!');
  lock--;
  save();
}
async function titleFlow() {
  mode = 'title'; MAP = null; lock = 0;
  $('title').hidden = false; $('dialog').hidden = true; $('battle').hidden = true; $('fade').classList.remove('on');
  const saved = loadSave();
  const i = await menu($('titlemenu'), [{ label: 'Begin your first day' }, { label: 'Continue', dis: !saved }], { start: saved ? 1 : 0, noCancel: true });
  if (i === 1 && saved) { S = saved; $('title').hidden = true; await enterMap(S.map, S.x, S.y, S.dir); }
  else await newGame();
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (mode === 'explore' && MAP && P) updateExplore(dt);
  else if (mode === 'battle' && B) updateBattle(dt);
  render(now / 1000);
  updateHUD();
  requestAnimationFrame(loop);
}

const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => (S && mode === 'explore' ? { save: JSON.stringify(S) } : {}));
function boot(data) {
  requestAnimationFrame(loop);
  if (data && data.save) {
    try { S = JSON.parse(data.save); $('title').hidden = true; enterMap(S.map, S.x, S.y, S.dir); return; } catch (e) { /* fall through to title */ }
  }
  titleFlow();
}
if (hot && typeof hot.ready === 'function') hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
