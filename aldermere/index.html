<title>Aldermere Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cinzel+Decorative:wght@700&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* Layout: one 16:9 game stage (480x270 world, drawn at 2x) with look-book windows overlaid; touch pad below on phones.
   Look Book 10 palette: midnight navy windows, thin gold frames with corner brackets, Cinzel name tabs, pixel body text. */
:root {
  --night: #0b0d18;
  --ink: #f2e6c9;
  --win-top: #232a52;
  --win-bot: #11152b;
  --frame: #8f7038;
  --gold: #e2b25a;
  --dim: #9aa3c8;
  --hp: #2fb3a8;
  --mp: #2f8fbf;
  --atb: #f5a93a;
  --danger: #d23f3a;
  --memory-top: #3b2a62;
  --memory-bot: #170f30;
  --ui: 'Pixelify Sans', 'Courier New', monospace;
  --label: 'Cinzel', 'Palatino Linotype', Georgia, serif;
  --display: 'Cinzel Decorative', 'Palatino Linotype', Georgia, serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { height: 100%; background: var(--night); font-variant-ligatures: none; font-feature-settings: "liga" 0, "clig" 0; }
body {
  margin: 0; min-height: 100%; box-sizing: border-box;
  background: var(--night); color: var(--ink); font-family: var(--ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}
#stage {
  position: relative; width: min(100%, 1280px, calc((100vh - 64px) * 16 / 9));
  aspect-ratio: 16 / 9; max-width: 100%;
  container-type: inline-size; background: #000;
  border: 1px solid var(--frame); border-radius: 4px; overflow: hidden;
  box-shadow: 0 0 0 3px #07080f, 0 0 0 4px #2a2442;
  user-select: none; -webkit-user-select: none; touch-action: none;
}
canvas#cv { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
.ov { position: absolute; }

/* Look-book window: navy gradient, dim gold border, bright gold corner brackets */
.win {
  --c: var(--gold);
  background:
    linear-gradient(var(--c), var(--c)) left 3px top 3px / 9px 1px no-repeat,
    linear-gradient(var(--c), var(--c)) left 3px top 3px / 1px 9px no-repeat,
    linear-gradient(var(--c), var(--c)) right 3px top 3px / 9px 1px no-repeat,
    linear-gradient(var(--c), var(--c)) right 3px top 3px / 1px 9px no-repeat,
    linear-gradient(var(--c), var(--c)) left 3px bottom 3px / 9px 1px no-repeat,
    linear-gradient(var(--c), var(--c)) left 3px bottom 3px / 1px 9px no-repeat,
    linear-gradient(var(--c), var(--c)) right 3px bottom 3px / 9px 1px no-repeat,
    linear-gradient(var(--c), var(--c)) right 3px bottom 3px / 1px 9px no-repeat,
    linear-gradient(180deg, var(--win-top), var(--win-bot));
  border: 1px solid var(--frame); border-radius: 3px;
  box-shadow: 0 0 0 1px #07080f, 0 4px 14px rgba(0,0,0,.45);
  color: var(--ink); text-shadow: 1px 1px 0 rgba(0,0,0,.6);
}
/* When assets/ui_window.png is present it replaces the drawn frame (16px corners, 9-slice) */
.skinned .win { background: none; border-style: solid; border-width: 8px; border-image: var(--win-skin) 16 / 8px fill stretch; box-shadow: 0 4px 14px rgba(0,0,0,.45); }
.tab {
  font-family: var(--label); font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--gold); background: linear-gradient(180deg, #1c2244, #0f1327); border: 1px solid var(--frame);
  border-radius: 2px; padding: .15em .8em; white-space: nowrap; box-shadow: 0 0 0 1px #07080f;
}
.opt { position: relative; display: flex; justify-content: space-between; gap: 1em; padding: .1em .35em .1em 1.25em; border-radius: 2px; cursor: pointer; }
.opt.sel { background: rgba(226,178,90,.14); box-shadow: inset 1px 0 0 var(--gold); }
.opt.sel::before { content: '\25C6'; position: absolute; left: .35em; top: 50%; transform: translateY(-50%); font-size: .7em; color: var(--gold); }
.opt.dis { opacity: .42; cursor: default; }
.opt .sub { color: var(--mp); font-variant-numeric: tabular-nums; }

#fade { inset: 0; background: #000; opacity: 0; transition: opacity .4s; pointer-events: none; }
#fade.on { opacity: 1; }

#goal { top: 3%; left: 2%; max-width: 46%; padding: .45em .8em .45em; font-size: clamp(10px, 1.6cqw, 16px); line-height: 1.3; --win-top: rgba(28,34,70,.9); --win-bot: rgba(14,17,38,.9); }
#goal .tab { position: absolute; top: 0; left: .7em; transform: translateY(-60%); font-size: .8em; }
#goal .g { display: block; margin-top: .25em; }
#toast {
  top: 15%; left: 50%; transform: translateX(-50%); white-space: nowrap; pointer-events: none;
  font-family: var(--display); font-size: clamp(15px, 3.4cqw, 40px); color: var(--gold);
  text-shadow: 0 2px 0 #000, 0 0 14px rgba(0,0,0,.85); opacity: 0; transition: opacity .6s;
}
#toast.on { opacity: 1; }
#banner { top: 4%; left: 50%; transform: translateX(-50%); padding: .25em 1.3em; font-family: var(--label); font-weight: 700; letter-spacing: .06em; font-size: clamp(12px, 2.2cqw, 24px); white-space: nowrap; }

#battle {
  left: 1.5%; right: 1.5%; bottom: 2.5%; max-height: 40%;
  display: grid; grid-template-columns: minmax(0, 30%) minmax(0, 1fr); gap: 1cqw;
  font-size: clamp(11px, 1.9cqw, 20px); line-height: 1.3;
}
#cmds { padding: .55em .5em .45em; overflow: auto; min-width: 0; }
#cmdtitle { color: var(--gold); font-family: var(--label); font-weight: 700; font-size: .78em; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 .2em .3em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#party { padding: .5em .8em; display: flex; flex-direction: column; justify-content: center; gap: .45em; min-width: 0; }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr) minmax(0, 1fr) 20%; gap: .8em; align-items: center; font-variant-numeric: tabular-nums; }
.prow .pn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .stat { display: flex; flex-direction: column; gap: .12em; min-width: 0; }
.prow .lbl { color: var(--dim); font-size: .78em; margin-right: .3em; }
.bar { height: .32em; background: #0a0d1f; border: 1px solid #3a3f66; border-radius: 1px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; }
.bar.hp i { background: var(--hp); } .bar.mp i { background: var(--mp); }
.prow.active .pn { color: var(--gold); }
.prow.ko { color: var(--danger); }
.atb { height: .55em; background: #0a0d1f; border: 1px solid var(--frame); border-radius: 1px; overflow: hidden; }
.atb i { display: block; height: 100%; width: 0; background: var(--atb); }
.prow.ready .atb i { background: #ffe4a8; box-shadow: 0 0 6px #ffd27a; }

#dialog {
  left: 2%; right: 2%; bottom: 3.5%; min-height: 25%; box-sizing: border-box;
  padding: 2.2cqw 2.6cqw 2cqw; font-size: clamp(12px, 2.2cqw, 25px); line-height: 1.4; cursor: pointer;
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2.2cqw; align-items: start;
}
#dialog.noportrait { grid-template-columns: minmax(0, 1fr); }
#dialog.noportrait #portrait { display: none; }
#dialog.memory { --win-top: var(--memory-top); --win-bot: var(--memory-bot); --c: #c07ad8; font-style: italic; }
#dialog.memory #who { color: #e4cdfa; }
#who { position: absolute; top: 0; left: 2.4cqw; transform: translateY(-58%); font-size: .8em; font-style: normal; }
#portrait { width: clamp(52px, 13cqw, 160px); aspect-ratio: 1; height: auto; border: 1px solid var(--frame); box-shadow: 0 0 0 1px #07080f, inset 0 0 0 1px rgba(226,178,90,.3); background: #12162c; image-rendering: pixelated; }
.dtext { min-width: 0; }
#say { max-width: 68ch; }
#choices { margin-top: .4em; }
#more { position: absolute; right: 1.6cqw; bottom: .9cqw; color: var(--gold); animation: bob .8s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(3px); } }

#title { inset: 0; display: flex; flex-direction: column; align-items: center; padding-top: 6cqw; gap: 1cqw; text-align: center; }
#title h1 {
  margin: 0; font-family: var(--display); font-size: clamp(30px, 8cqw, 104px); line-height: 1; color: var(--gold);
  letter-spacing: .03em; text-wrap: balance; text-shadow: 0 3px 0 #2e2108, 0 0 24px rgba(226,178,90,.35);
}
#title .sub { font-family: var(--label); font-weight: 600; font-size: clamp(11px, 2cqw, 24px); letter-spacing: .4em; text-transform: uppercase; color: var(--ink); }
#title .pillars { font-size: clamp(9px, 1.3cqw, 15px); letter-spacing: .3em; text-transform: uppercase; color: var(--dim); }
#titlebox { margin-top: 1.6cqw; padding: .7em 1em; min-width: 30cqw; font-size: clamp(12px, 2.1cqw, 22px); text-align: left; }

#namebox { inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(4,5,18,.55); }
#nameform { position: relative; width: min(84%, 560px); padding: 2.4cqw 3cqw 2cqw; display: flex; flex-direction: column; gap: 1.2cqw; font-size: clamp(13px, 2.2cqw, 22px); }
#nameform .tab { position: absolute; top: 0; left: 1.2em; transform: translateY(-58%); font-size: .75em; }
#nameform label { line-height: 1.35; }
#nameinput { font: inherit; background: #0a0d1f; color: #fff; border: 1px solid var(--frame); border-radius: 2px; padding: .3em .5em; }
#nameinput:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.act { align-self: flex-end; font: inherit; font-weight: 600; background: var(--gold); color: #1b1432; border: 0; border-radius: 2px; padding: .35em 1em; cursor: pointer; }

#pause { inset: 4% 3% 3%; padding: 2cqw 2.2cqw; overflow: auto; font-size: clamp(11px, 1.8cqw, 18px); line-height: 1.35; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2cqw; align-items: start; }
#pause h3 { display: inline-block; margin: 0 0 .45em; font-size: .78em; }
#pause section { margin-bottom: 1em; }
#pause .pc { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 0 1em; margin-bottom: .5em; font-variant-numeric: tabular-nums; }
#pause .pc .nm { color: #fff; font-weight: 600; }
#pause .dim { color: var(--dim); }
#pause ul { margin: 0; padding-left: 1.1em; }
#pause li { margin-bottom: .25em; }
#pausemenu { min-width: 9em; position: sticky; top: 0; }
@container (max-width: 540px) { #pause { grid-template-columns: 1fr; } #pausemenu { position: static; order: -1; } }

#card { inset: 0; background: rgba(4,4,14,.9); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2cqw; text-align: center; padding: 4cqw; }
#card h2 { margin: 0; font-family: var(--display); color: var(--gold); font-size: clamp(22px, 5.4cqw, 64px); text-wrap: balance; }
#card p { margin: 0; max-width: 52ch; font-size: clamp(12px, 2cqw, 20px); line-height: 1.45; }
#cardmenu { padding: .45em .9em; font-size: clamp(12px, 2cqw, 20px); margin-top: 1cqw; }

#pad { width: min(100%, 520px); display: flex; justify-content: space-between; align-items: center; gap: 16px; touch-action: none; user-select: none; -webkit-user-select: none; }
#pad button { font: 600 16px var(--ui); color: var(--ink); background: linear-gradient(180deg, #232a52, #11152b); border: 1px solid var(--frame); border-radius: 10px; touch-action: none; box-shadow: 0 0 0 1px #07080f; }
#pad button:active, #pad button.down { background: #343d78; }
.dpad { display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); gap: 4px; }
.dpad [data-a="up"] { grid-area: 1 / 2; } .dpad [data-a="left"] { grid-area: 2 / 1; }
.dpad [data-a="right"] { grid-area: 2 / 3; } .dpad [data-a="down"] { grid-area: 3 / 2; }
.abtns { display: flex; align-items: center; gap: 10px; }
.abtns [data-a="ok"], .abtns [data-a="cancel"] { width: 60px; height: 60px; border-radius: 50%; }
.abtns [data-a="ok"] { background: linear-gradient(180deg, #c99a3e, #7a5414); color: #1b1432; }
.abtns [data-a="menu"] { padding: 8px 12px; font-size: 13px; }
#help { color: var(--dim); font-size: 13px; text-align: center; max-width: 70ch; line-height: 1.5; }
#help kbd { font-family: var(--ui); color: var(--ink); border: 1px solid #3a3f66; border-radius: 3px; padding: 0 .35em; }
@media (hover: hover) and (pointer: fine) { #pad { display: none; } }
@media (hover: none), (pointer: coarse) { #help { display: none; } }
@media (prefers-reduced-motion: reduce) { #more { animation: none; } #fade, #toast { transition: none; } }
</style>

<div id="stage">
  <canvas id="cv" width="960" height="540"></canvas>
  <div id="fade" class="ov"></div>
  <div id="goal" class="ov win" hidden></div>
  <div id="toast" class="ov"></div>
  <div id="banner" class="ov win" hidden></div>
  <div id="battle" class="ov" hidden>
    <div id="cmds" class="win"><div id="cmdtitle"></div><div id="cmdlist"></div></div>
    <div id="party" class="win"></div>
  </div>
  <div id="dialog" class="ov win noportrait" hidden>
    <div id="who" class="tab"></div>
    <canvas id="portrait" width="128" height="128"></canvas>
    <div class="dtext"><div id="say"></div><div id="choices"></div></div>
    <div id="more" hidden>&#9660;</div>
  </div>
  <div id="pause" class="ov win" hidden><div id="pausebody"></div><div id="pausemenu"></div></div>
  <div id="card" class="ov" hidden><h2 id="cardtitle"></h2><div id="cardtext"></div><div id="cardmenu" class="win"></div></div>
  <div id="namebox" class="ov" hidden>
    <form id="nameform" class="win" autocomplete="off">
      <span class="tab">Registry</span>
      <label for="nameinput">Your name is the only thing you remember. What is it?</label>
      <input id="nameinput" maxlength="12" placeholder="Rowan" spellcheck="false">
      <button class="act" type="submit">Wake up</button>
    </form>
  </div>
  <div id="title" class="ov">
    <h1>Aldermere</h1>
    <div class="sub">The Unwritten Student</div>
    <div class="pillars">Study &middot; Cast &middot; Explore &middot; Remember</div>
    <div id="titlebox" class="win"><div id="titlemenu"></div></div>
  </div>
</div>

<div id="pad" aria-label="Touch controls">
  <div class="dpad">
    <button data-a="up" aria-label="Up">&#9650;</button>
    <button data-a="left" aria-label="Left">&#9664;</button>
    <button data-a="right" aria-label="Right">&#9654;</button>
    <button data-a="down" aria-label="Down">&#9660;</button>
  </div>
  <div class="abtns">
    <button data-a="menu">Menu</button>
    <button data-a="cancel" aria-label="Back">B</button>
    <button data-a="ok" aria-label="Confirm">A</button>
  </div>
</div>
<p id="help"><kbd>Arrows</kbd>/<kbd>WASD</kbd> move &middot; <kbd>Z</kbd>/<kbd>Enter</kbd> talk and confirm &middot; <kbd>X</kbd>/<kbd>Esc</kbd> back and open the menu. Battle gauges pause while you choose a command.</p>

<script>
(() => {
'use strict';
const cv = document.getElementById('cv');
let ctx = cv.getContext('2d');
const W = 480, H = 270, TS = 16, DPR = 2; // world logic in 480x270; the canvas backs it at 2x so HD sprites keep their detail
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------------------------------------------------------------- palette
// Look Book 10 swatches, each expanded to four shades. Every colour the game draws snaps to the nearest entry.
const SWATCHES = ['#1b1f33', '#1f4fa3', '#2f8fbf', '#2fb3a8', '#dfe5df', '#f2c89a', '#f5a93a', '#ec8a2f', '#d23f3a', '#f08aa0', '#c07ad8', '#6b46a8'];
const EXTRA_SWATCHES = ['#4f8a3c']; // forest green: the look book's environments use it, but the swatch strip leaves it out
const hex2rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgb2hex = c => '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
const mixc = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const INK = [11, 13, 24], CREAM = [255, 244, 220];
const PAL = [INK];
for (const h of [...SWATCHES, ...EXTRA_SWATCHES]) {
  const c = hex2rgb(h), lum = c[0] * .3 + c[1] * .59 + c[2] * .11;
  if (lum < 50) PAL.push(c, mixc(c, CREAM, .15), mixc(c, CREAM, .3), mixc(c, CREAM, .45));
  else if (lum > 200) PAL.push(mixc(c, INK, .6), mixc(c, INK, .4), mixc(c, INK, .2), c);
  else PAL.push(mixc(c, INK, .55), mixc(c, INK, .3), c, mixc(c, CREAM, .35));
}
const snapCache = new Map();
function snap(c) {
  if (typeof c !== 'string' || c[0] !== '#' || c.length !== 7) return c;
  let v = snapCache.get(c);
  if (v) return v;
  const [r, g, b] = hex2rgb(c);
  let best = PAL[0], bd = Infinity;
  for (const p of PAL) {
    const rm = (r + p[0]) / 2;
    const d = (2 + rm / 256) * (r - p[0]) ** 2 + 4 * (g - p[1]) ** 2 + (2 + (255 - rm) / 256) * (b - p[2]) ** 2;
    if (d < bd) { bd = d; best = p; }
  }
  v = rgb2hex(best); snapCache.set(c, v); return v;
}

// ---------------------------------------------------------------- data
const HOUSES = {
  ember: { name: 'Emberhold', color: '#d23f3a', elem: 'fire', motto: 'Courage that burns', spells: ['ember', 'fireball'], tech: 'Steam Burst' },
  tide:  { name: 'Tidewyrm',  color: '#1f4fa3', elem: 'water', motto: 'Wisdom runs deep', spells: ['lash', 'maelstrom'], tech: 'Twin Tides' },
  thorn: { name: 'Thornveil', color: '#2fb3a8', elem: 'earth', motto: 'Roots hold fast', spells: ['thorn', 'quake'], tech: 'Bloom Surge' },
  gale:  { name: 'Galecrest', color: '#c07ad8', elem: 'air', motto: 'Rise past the sky', spells: ['gust', 'tempest'], tech: 'Storm Squall' },
};
const HOUSE_ORDER = ['ember', 'tide', 'thorn', 'gale'];
const ELEM_COLOR = { fire: '#ec8a2f', water: '#2f8fbf', earth: '#2fb3a8', air: '#dfe5df', arcane: '#c07ad8', light: '#f5a93a', shadow: '#6b46a8', heal: '#2fb3a8', time: '#f5a93a' };
const SPELLS = {
  ember:     { name: 'Ember', mp: 2, pow: 14, elem: 'fire', tgt: 'one' },
  lash:      { name: 'Tidal Lash', mp: 2, pow: 14, elem: 'water', tgt: 'one' },
  thorn:     { name: 'Thornwhip', mp: 2, pow: 14, elem: 'earth', tgt: 'one' },
  gust:      { name: 'Gust Blade', mp: 2, pow: 14, elem: 'air', tgt: 'one' },
  mend:      { name: 'Mend', mp: 3, heal: 34, tgt: 'ally' },
  bolt:      { name: 'Arcane Bolt', mp: 4, pow: 28, elem: 'arcane', tgt: 'one' },
  fireball:  { name: 'Fireball', mp: 7, pow: 24, elem: 'fire', tgt: 'all' },
  maelstrom: { name: 'Maelstrom', mp: 7, pow: 24, elem: 'water', tgt: 'all' },
  quake:     { name: 'Rootquake', mp: 7, pow: 24, elem: 'earth', tgt: 'all' },
  tempest:   { name: 'Tempest', mp: 7, pow: 24, elem: 'air', tgt: 'all' },
  radiance:  { name: 'Radiance', mp: 10, pow: 52, elem: 'light', tgt: 'one' },
  chrono:    { name: 'Chronoslip', mp: 8, tgt: 'other', haste: true },
  greatmend: { name: 'Great Mend', mp: 12, heal: 70, tgt: 'allies' },
  horizon:   { name: 'Event Horizon', mp: 24, pow: 95, elem: 'arcane', tgt: 'all' },
};
const RANKS = [[1, 'Unawakened'], [2, 'Initiate'], [4, 'Apprentice'], [5, 'Adept'], [7, 'Magus'], [9, 'Archmage'], [12, 'Archwizard']];
const XP = [0, 0, 30, 80, 150, 250, 380, 550, 750, 1000, 1300, 1650, 2050]; // total XP to reach level n
const MAXLV = 12;
const MEMORIES = {
  2: 'A word rises out of the dark, warm as a coal. The first spell you ever learned. You have learned it before.',
  4: 'A clocktower that is on no map of Aldermere. Its hands run backwards. You used to climb it to think.',
  5: 'Your own voice, older and tired: "If this works, you will arrive with nothing. Not even your name. Do it anyway."',
  7: 'Wax and starlight. Your palm pressing a seal into a door, and a hooded giant bowing low. "I will keep it until you return."',
  9: 'A battlefield where every second has frozen solid. A woman with red hair and a Tidewyrm scarf stands in the last one. You did not reach her in time.',
  12: 'Everything returns at once. You were Archwizard of Aldermere. You failed to stop the Hour of Stopped Clocks. So you came back, with nothing, to choose differently.',
};
const rankOf = lv => { let r = RANKS[0][1]; for (const [l, n] of RANKS) if (lv >= l) r = n; return r; };
const nextRank = lv => RANKS.find(([l]) => l > lv);

// The hero sheet draws the scarf red; each House gets a recoloured copy.
function tintScarf(im, hex) {
  try {
    const c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
    const g = c.getContext('2d'); g.drawImage(im, 0, 0);
    const d = g.getImageData(0, 0, c.width, c.height), p = d.data;
    const [tr, tg, tb] = hex2rgb(hex);
    for (let i = 0; i < p.length; i += 4) {
      const r = p[i], gg = p[i + 1], b = p[i + 2];
      if (p[i + 3] && r > 90 && r > gg * 1.7 && r > b * 1.7) {
        const l = .3 + .9 * (r / 255);
        p[i] = Math.min(255, tr * l); p[i + 1] = Math.min(255, tg * l); p[i + 2] = Math.min(255, tb * l);
      }
    }
    g.putImageData(d, 0, 0);
    return c;
  } catch (e) { return im; } // pixel access is blocked when the page is opened from disk; keep the red scarf
}

function drawWalker(im, x, feetY, dir, moving, t) {

  const f = im.width / 6, d = f / 2;

  px(x + 2, feetY - 1, 12, 2, 'rgba(0,0,0,.3)');
  ctx.drawImage(im, col * f, WALK_ROW[dir] * f, f, f, Math.round(x + 8 - d / 2), Math.round(feetY - d + 1), d, d);
  return true;
}

const KEYMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',

function emit(a) {

// ---------------------------------------------------------------- UI helpers
function menu(el, items, { start = 0, noCancel = false } = {}) {
  return new Promise(res => {
    el.innerHTML = '';
    let sel = items.findIndex((it, i) => i >= start && !it.dis);
    if (sel < 0) sel = Math.max(0, items.findIndex(it => !it.dis));
    const nodes = items.map((it, i) => {
      const d = document.createElement('div');
      d.className = 'opt' + (it.dis ? ' dis' : '');
      d.innerHTML = `<span>${esc(it.label)}</span>` + (it.sub ? `<span class="sub">${esc(it.sub)}</span>` : '');
      d.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (it.dis) return; sel = i; draw(); done(i); });
      el.appendChild(d); return d;
    });
    function draw() {
      nodes.forEach((n, i) => n.classList.toggle('sel', i === sel));
      const n = nodes[sel], sc = el.closest('#cmds') || el;
      if (n && sc.scrollHeight > sc.clientHeight) {
        if (n.offsetTop < sc.scrollTop) sc.scrollTop = n.offsetTop;
        else if (n.offsetTop + n.offsetHeight > sc.scrollTop + sc.clientHeight) sc.scrollTop = n.offsetTop + n.offsetHeight - sc.clientHeight;
      }
    }
    function done(v) { pop(h); res(v); }
    const h = a => {
      if (!items.length) { if (a === 'cancel' && !noCancel) done(-1); return; }
      if (a === 'up' || a === 'left') { sel = (sel - 1 + items.length) % items.length; draw(); }
      else if (a === 'down' || a === 'right') { sel = (sel + 1) % items.length; draw(); }
      else if (a === 'ok') { if (!items[sel].dis) done(sel); }
      else if (a === 'cancel' && !noCancel) done(-1);
    };
    push(h); draw();
  });
}

const SPEAKERS = {

  'Mira': 'mira', 'Pell': 'pell', 'Juniper': 'juniper', 'Tobias': 'tobias', 'Sir Pemberton': 'ghost',
  'The Hollow Warden': 'warden', 'Oracle Lantern': 'lantern',
};
const FACES = { neutral: 0, happy: 1, shocked: 2 };
const pctx = $('portrait').getContext('2d');
function withCtx(c, fn) { const old = ctx; ctx = c; try { fn(); } finally { ctx = old; } }
function drawPortrait(id, face) {
  const pc = pctx, N = 128;
  pc.setTransform(1, 0, 0, 1, 0, 0); pc.imageSmoothingEnabled = false;
  const g = pc.createLinearGradient(0, 0, 0, N); g.addColorStop(0, snap('#2a3266')); g.addColorStop(1, snap('#12162c'));
  pc.fillStyle = g; pc.fillRect(0, 0, N, N);
  const art = IMG[`portrait_${id}.png`];
  if (art) { const f = art.height; pc.drawImage(art, (FACES[face] || 0) * f, 0, f, f, 0, 0, N, N); return; }
  const t = performance.now() / 1000;
  if (id === 'hero' && heroSheet()) { pc.drawImage(heroSheet(), 14, 2, 36, 36, 0, 0, N, N); return; }
  const sheet = npcSheet(id);
  if (sheet) { const f = sheet.width / 6; pc.drawImage(sheet, f * .22, f * .03, f * .56, f * .56, 0, 0, N, N); return; }
  withCtx(pc, () => {
    if (id === 'warden') { pc.setTransform(2.4, 0, 0, 2.4, 0, 0); drawFoe('warden', 26.6, 42, t, 1); }
    else if (id === 'lantern') { pc.setTransform(7, 0, 0, 7, 0, 0); drawNPC({ kind: 'lantern', x: 0, y: 0 }, t, 1, 5); }
    else {
      pc.setTransform(11, 0, 0, 11, 0, 0);
      if (id === 'ghost') pc.globalAlpha = .6;
      const look = id === 'hero' ? heroLook() : id === 'ghost' ? { robe: '#cfe0ff', trim: '#ffffff', hair: '#e8f0ff', skin: '#e8f0ff' } : LOOKS[id];
      drawPerson(-2, .5, { ...look, dir: 'down' });
      pc.globalAlpha = 1;
    }
  });
}

  return new Promise(res => {
    const box = $('dialog');
    box.hidden = false; box.classList.toggle('memory', !!o.memory);
    $('who').textContent = who || ''; $('who').hidden = !who;
    setSpeaker(o.memory ? null : who, o.face);
    $('choices').innerHTML = ''; $('more').hidden = true;
    const body = $('say');
    let i = 0, timer = null;
    const finish = () => { clearInterval(timer); body.textContent = text; pop(h); box.onpointerdown = null; res(); };
    const h = a => { if (a === 'ok' || a === 'cancel') finish(); };
    push(h);
    box.onpointerdown = e => { e.preventDefault(); finish(); };
    if (reduceMotion) { finish(); return; }
    body.textContent = '';
    timer = setInterval(() => { i += 2; body.textContent = text.slice(0, i); if (i >= text.length) finish(); }, 18);
  });
}
function waitOk() {
  return new Promise(res => {
    const box = $('dialog');
    const fin = () => { pop(h); box.onpointerdown = null; res(); };
    const h = a => { if (a === 'ok' || a === 'cancel') fin(); };
    push(h); box.onpointerdown = e => { e.preventDefault(); fin(); };
  });
}
async function say(who, text, o = {}) {
  await typeText(who, text, o);
  $('more').hidden = false;
  await waitOk();
  $('dialog').hidden = true;
}
async function choose(who, text, options) {
  await typeText(who, text);
  const i = await menu($('choices'), options.map(l => ({ label: l })), { noCancel: true });
  $('dialog').hidden = true;
  return i;
}
let toastTimer = null;
function toast(text) {
  const t = $('toast'); t.textContent = text; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 1800);
}
let bannerTimer = null;
function banner(text, ms = 1000) {
  const b = $('banner'); b.textContent = text; b.hidden = false;
  clearTimeout(bannerTimer); bannerTimer = setTimeout(() => { b.hidden = true; }, ms);
}
async function fadeOut() { $('fade').classList.add('on'); await sleep(reduceMotion ? 60 : 420); }
async function fadeIn() { $('fade').classList.remove('on'); await sleep(reduceMotion ? 60 : 420); }
async function run(fn) { lock++; try { await fn(); } finally { lock--; save(); } }

let goalKey = '';
function updateHUD() {
  const g = $('goal');
  const show = mode === 'explore' && S && MAP && $('pause').hidden && $('card').hidden;
  if (g.hidden === show) g.hidden = !show;
  if (!show) return;
  const key = S.lv + '|' + S.goal;
  if (key !== goalKey) { goalKey = key; g.innerHTML = `<span class="tab">Lv ${S.lv} &middot; ${esc(rankOf(S.lv))}</span><span class="g">${esc(S.goal)}</span>`; }
}

// ---------------------------------------------------------------- drawing primitives
function px(x, y, w, h, c) { ctx.fillStyle = snap(c); ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function fill(c) { ctx.fillStyle = snap(c); }
function stroke(c) { ctx.strokeStyle = snap(c); }
function hash(a, b) { let h = (a * 374761393 + b * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
const mapW = () => MAP.rows[0].length, mapH = () => MAP.rows.length;
const tileAt = (x, y) => (MAP && y >= 0 && y < mapH() && x >= 0 && x < mapW()) ? MAP.rows[y][x] : '#';

function drawTileFromSheet(c, X, Y, bigs) {
  const im = IMG['tiles.png'];
  if (!im) return false;
  let key = c;
  if (c === ',' && hash(X, Y) > .5) key = ',2';
  if (c === 'g' && S.flags.archiveOpen) key = 'g+';
  const pos = TILE_LAYOUT[key];
  if (!pos) return false;
  const cell = im.width / 6, x = X * TS, y = Y * TS;
  const base = OVERLAY_BASE[c];
  if (base) { const bp = TILE_LAYOUT[base]; ctx.drawImage(im, bp[0] * cell, bp[1] * cell, cell, cell, x, y, TS, TS); }
  if (c === 'f') { if (tileAt(X - 1, Y) !== 'f' && tileAt(X, Y - 1) !== 'f') bigs.push(() => ctx.drawImage(im, pos[0] * cell, pos[1] * cell, cell, cell, x, y, TS * 2, TS * 2)); return true; }
  ctx.drawImage(im, pos[0] * cell, pos[1] * cell, cell, cell, x, y, TS, TS);
  return true;
}

function drawTile(X, Y, t, bigs) {
  const c = tileAt(X, Y);
  if (drawTileFromSheet(c, X, Y, bigs)) return;
  const x = X * TS, y = Y * TS, h = hash(X, Y);
  const floor = () => { px(x, y, 16, 16, '#545a76'); px(x, y + 15, 16, 1, '#454a64'); px(x + 15, y, 1, 16, '#454a64'); if (h > .7) px(x + 4, y + 6, 3, 1, '#61688c'); };
  const grass = () => { px(x, y, 16, 16, '#3d7140'); if (h > .45) { px(x + (h * 13 | 0), y + ((h * 97) % 12 | 0), 1, 2, '#5a9a4a'); px(x + ((h * 53) % 13 | 0), y + ((h * 31) % 13 | 0), 1, 2, '#2e5a32'); } };
  switch (c) {
    case ',': grass(); break;
    case 'p': px(x, y, 16, 16, '#b19866'); px(x + (h * 14 | 0), y + ((h * 71) % 14 | 0), 2, 1, '#957d54'); if (h > .6) px(x + ((h * 37) % 13 | 0), y + ((h * 19) % 13 | 0), 1, 1, '#cbb380'); break;
    case 's': px(x, y, 16, 16, '#d8b884'); if (h > .4) px(x + ((h * 41) % 13 | 0), y + ((h * 23) % 13 | 0), 2, 1, '#c09a64'); break;
    case '.': floor(); break;
    case '=': {
      px(x, y, 16, 16, '#7a2234');
      if (tileAt(X - 1, Y) !== '=') px(x, y, 1, 16, '#e2b25a');
      if (tileAt(X + 1, Y) !== '=') px(x + 15, y, 1, 16, '#e2b25a');
      if (tileAt(X, Y - 1) !== '=') px(x, y, 16, 1, '#e2b25a');
      px(x + 7, y + 7, 2, 2, '#963848'); break;
    }
    case '#': case 'w': {
      px(x, y, 16, 16, '#2c3050');
      for (let r = 0; r < 4; r++) { px(x, y + r * 4, 16, 1, '#3a3f66'); const off = r % 2 ? 4 : 0; for (let k = 0; k < 2; k++) px(x + off + k * 8, y + r * 4 + 1, 1, 3, '#20233d'); }
      if (c === 'w') {
        const glow = 0.75 + 0.25 * Math.sin(t * 3 + X);
        px(x + 4, y + 3, 8, 11, '#181a30');
        ctx.globalAlpha = glow; px(x + 5, y + 5, 6, 8, '#f5a93a'); px(x + 6, y + 4, 4, 1, '#f5a93a'); ctx.globalAlpha = 1;
        px(x + 7, y + 4, 2, 9, '#181a30'); px(x + 5, y + 8, 6, 1, '#181a30');
      }
      break;
    }
    case 'T': grass(); px(x + 6, y + 10, 4, 6, '#5a3a22'); px(x + 2, y + 1, 12, 10, '#21502c'); px(x + 1, y + 3, 14, 6, '#21502c'); px(x + 4, y + 2, 4, 3, '#2f6a3a'); px(x + 9, y + 5, 3, 2, '#2a5e34'); break;
    case 'K': {
      grass(); px(x + 6, y + 10, 4, 6, '#5a3a22');
      px(x + 2, y + 1, 12, 10, '#d0708a'); px(x + 1, y + 3, 14, 6, '#d0708a'); px(x + 4, y + 2, 5, 3, '#f08aa0'); px(x + 9, y + 6, 3, 2, '#f6b8c4');
      const fall = (t * 6 + h * 16) % 16;
      px(x + ((h * 29) % 14 | 0), y + 4 + fall, 1, 1, '#f6b8c4');
      break;
    }
    case 'l': {
      grass(); px(x + 4, y + 14, 8, 2, 'rgba(0,0,0,.25)');
      px(x + 7, y + 4, 2, 11, '#1b1f33'); px(x + 5, y, 6, 5, '#2a2f4a');
      ctx.globalAlpha = .8 + .2 * Math.sin(t * 5 + X); px(x + 6, y + 1, 4, 3, '#f5a93a'); ctx.globalAlpha = .18; fill('#f5a93a'); ctx.beginPath(); ctx.arc(x + 8, y + 3, 9, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
      break;
    }
    case 'b': {
      grass(); px(x + 1, y + 6, 14, 8, '#5a3a22'); px(x + 1, y + 6, 14, 1, '#7a5432');
      const cols = ['#f08aa0', '#f5a93a', '#c07ad8', '#dfe5df'];
      for (let i = 0; i < 6; i++) { px(x + 2 + i * 2, y + 7 + (i % 2) * 3, 2, 2, cols[(i + (h * 10 | 0)) % 4]); px(x + 2 + i * 2, y + 9 + (i % 2) * 3, 1, 1, '#2f6a3a'); }
      break;
    }
    case '~': { px(x, y, 16, 16, '#2a5a9a'); const o = (t * 8 + X * 4) % 16 | 0; px(x + o, y + 5, 4, 1, '#5a8ad0'); px(x + (o + 8) % 16, y + 11, 4, 1, '#5a8ad0'); break; }
    case 'f': {
      px(x, y, 16, 16, '#9a9ab4'); px(x + 2, y + 2, 12, 12, '#2f8fbf');
      if (tileAt(X - 1, Y) === 'f') px(x, y + 2, 2, 12, '#2f8fbf');
      if (tileAt(X + 1, Y) === 'f') px(x + 14, y + 2, 2, 12, '#2f8fbf');
      if (tileAt(X, Y - 1) === 'f') px(x + 2, y, 12, 2, '#2f8fbf');
      if (tileAt(X, Y + 1) === 'f') px(x + 2, y + 14, 12, 2, '#2f8fbf');
      const s = Math.sin(t * 3 + X * 2 + Y);
      px(x + 7 + s * 3, y + 6 + Math.cos(t * 2 + X) * 2, 2, 2, '#dfe5df');
      break;
    }
    case 'B': {
      px(x, y, 16, 16, '#4a2e1e');
      const cols = ['#8a2a2a', '#2a5a8a', '#3a6a3a', '#a08a3a', '#5a3a7a'];
      for (let r = 0; r < 3; r++) { for (let i = 0; i < 7; i++) px(x + 1 + i * 2, y + 1 + r * 5, 2, 4, cols[((h * 100 | 0) + i * 7 + r * 3) % 5]); px(x, y + 5 + r * 5, 16, 1, '#2e1a10'); }
      break;
    }
    case 't': floor(); px(x, y + 3, 16, 9, '#7a4e2a'); px(x, y + 3, 16, 2, '#9a6a3a'); px(x, y + 12, 16, 1, '#3a2414'); if (h > .55) { px(x + 7, y + 1, 2, 3, '#f2e6c9'); px(x + 7, y - 1 + Math.sin(t * 9 + X) * .6, 2, 2, '#f5a93a'); } break;
    case 'c': {
      if (MAPID === 'archive') px(x, y, 16, 16, '#1e1a2c'); else floor();
      const fl = Math.sin(t * 10 + X) > 0 ? 0 : 1;
      px(x + 4, y + 5, 8, 11, '#7a7e98'); px(x + 3, y + 3, 10, 3, '#9a9eb8');
      px(x + 5, y - 1 + fl, 6, 4, '#ec8a2f'); px(x + 6, y + fl, 4, 3, '#f5a93a'); break;
    }
    case 'd': px(x, y, 16, 16, '#3a2a20'); px(x + 1, y + 1, 14, 15, '#6a4628'); px(x + 7, y + 1, 2, 15, '#4a301a'); px(x + 5, y + 8, 1, 2, '#e2b25a'); px(x + 10, y + 8, 1, 2, '#e2b25a'); break;
    case 'g': {
      if (S.flags.archiveOpen) { px(x, y, 16, 16, '#1e1a2c'); ctx.globalAlpha = .4; px(x + 6, y + 6, 4, 4, '#c07ad8'); ctx.globalAlpha = 1; break; }
      px(x, y, 16, 16, '#24163a'); px(x + 1, y + 1, 14, 14, '#36225a');
      const side = tileAt(X + 1, Y) === 'g' ? 1 : -1;
      ctx.globalAlpha = .45 + .35 * Math.sin(t * 2); stroke('#c07ad8'); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(x + (side > 0 ? 16 : 0), y + 8, 6, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(x + (side > 0 ? 16 : 0), y + 8, 3, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
      break;
    }
    case 'x': px(x, y, 16, 16, '#1e1a2c'); px(x, y + 15, 16, 1, '#16131f'); px(x + 15, y, 1, 16, '#16131f'); if (h > .8) px(x + 5, y + 5, 2, 2, '#2a2440'); break;
    case 'X': px(x, y, 16, 16, '#120f1c'); for (let r = 0; r < 4; r++) px(x, y + r * 4, 16, 1, '#1c1830'); break;
    default: px(x, y, 16, 16, '#0b0d18');
  }
}

function drawPerson(x, y, o) {
  x = Math.round(x * 2) / 2; y = Math.round(y * 2) / 2;
  const { robe, trim, hair, skin, dir = 'down', step = 0, hat } = o;
  px(x + 3, y + 14, 10, 2, 'rgba(0,0,0,.3)');
  if (step) { px(x + 5, y + 12, 2, 3, '#1a1420'); px(x + 9, y + 13, 2, 2, '#1a1420'); }
  else { px(x + 5, y + 13, 2, 2, '#1a1420'); px(x + 9, y + 13, 2, 2, '#1a1420'); }
  px(x + 4, y + 8, 8, 5, robe); px(x + 3, y + 10, 10, 3, robe);
  px(x + 5, y + 8, 6, 1, trim);
  if (dir === 'down') px(x + 7, y + 9, 2, 3, trim);
  if (dir === 'left') px(x + 2, y + 9, 2, 2, skin);
  if (dir === 'right') px(x + 12, y + 9, 2, 2, skin);
  px(x + 5, y + 3, 6, 5, skin);
  px(x + 4, y + 2, 8, 2, hair);
  if (dir === 'up') px(x + 4, y + 2, 8, 6, hair);
  else if (dir === 'left') { px(x + 9, y + 3, 3, 4, hair); px(x + 6, y + 5, 1, 1, '#1a1420'); }
  else if (dir === 'right') { px(x + 4, y + 3, 3, 4, hair); px(x + 9, y + 5, 1, 1, '#1a1420'); }
  else { px(x + 4, y + 3, 1, 3, hair); px(x + 11, y + 3, 1, 3, hair); px(x + 6, y + 5, 1, 1, '#1a1420'); px(x + 9, y + 5, 1, 1, '#1a1420'); }
  if (hat) { px(x + 3, y + 2, 10, 1, hat); px(x + 5, y, 6, 2, hat); px(x + 6, y - 2, 4, 2, hat); px(x + 8, y - 4, 2, 2, hat); }
}

function drawFoe(art, cx, cy, t, k = 1, state) {
  if (drawFoeSprite(art, cx, cy, t, state, art === 'warden' ? k : 1)) return;
  const x = Math.round(cx), y = Math.round(cy);
  switch (art) {
    case 'dummy':
      px(x - 4, y + 9, 8, 2, 'rgba(0,0,0,.3)'); px(x - 1, y - 2, 2, 12, '#7a5a32'); px(x - 6, y - 1, 12, 2, '#7a5a32');
      px(x - 4, y - 9, 8, 8, '#d8c07a'); px(x - 3, y - 8, 6, 6, '#c0453a'); px(x - 2, y - 7, 4, 4, '#f2e6c9'); px(x - 1, y - 6, 2, 2, '#c0453a'); break;
    case 'imp': {
      const b = Math.sin(t * 6 + x) * 1.5;
      px(x - 6, y + 9, 12, 2, 'rgba(0,0,0,.3)');
      px(x - 6, y - 4 + b, 12, 10, '#1c1830'); px(x - 5, y - 6 + b, 10, 2, '#1c1830'); px(x - 6, y - 8 + b, 2, 3, '#1c1830'); px(x + 4, y - 8 + b, 2, 3, '#1c1830');
      px(x - 3, y - 2 + b, 2, 2, '#f5a93a'); px(x + 1, y - 2 + b, 2, 2, '#f5a93a'); px(x - 2, y + 2 + b, 4, 1, '#c04a6a');
      px(x - 7, y + 6, 4, 2, '#1c1830'); px(x + 3, y + 6, 4, 2, '#1c1830'); break;
    }
    case 'broom': {
      const a = Math.sin(t * 5 + x) * 2;
      px(x - 5, y + 11, 10, 2, 'rgba(0,0,0,.3)');
      px(x - 1 + a * .4, y - 11, 2, 14, '#9a6a3a'); px(x - 5, y + 2, 10, 3, '#c8a04a'); px(x - 6, y + 5, 12, 5, '#e0c060');
      px(x - 6, y + 9, 2, 2, '#e0c060'); px(x + 4, y + 9, 2, 2, '#e0c060'); px(x - 2, y + 3, 1, 1, '#1b1f33'); px(x + 1, y + 3, 1, 1, '#1b1f33'); break;
    }
    case 'wisp': {
      const r = 5 + Math.sin(t * 4 + x);
      ctx.globalAlpha = .25; fill('#c07ad8'); ctx.beginPath(); ctx.arc(x, y, r + 4, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
      fill('#3a2a6a'); ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
      px(x - 3, y - 1, 2, 2, '#dfe5df'); px(x + 1, y - 1, 2, 2, '#dfe5df'); px(x - 1, y + r - 1, 2, 4, '#3a2a6a'); break;
    }
    case 'toad':
      px(x - 8, y + 8, 16, 2, 'rgba(0,0,0,.3)');
      px(x - 8, y - 2, 16, 9, '#4a7a3a'); px(x - 6, y - 6, 4, 4, '#4a7a3a'); px(x + 2, y - 6, 4, 4, '#4a7a3a');
      px(x - 5, y - 5, 2, 2, '#f5a93a'); px(x + 3, y - 5, 2, 2, '#f5a93a'); px(x - 6, y + 3, 12, 3, '#9ac06a');
      px(x - 9, y + 6, 4, 2, '#3a6a2a'); px(x + 5, y + 6, 4, 2, '#3a6a2a'); break;
    case 'gargoyle': {
      const w = Math.sin(t * 3) * 2;
      px(x - 9, y + 11, 18, 2, 'rgba(0,0,0,.35)');
      px(x - 14, y - 8 + w, 7, 8, '#5a5e6a'); px(x + 7, y - 8 + w, 7, 8, '#5a5e6a');
      px(x - 7, y - 10, 14, 18, '#7a7e8a'); px(x - 6, y - 14, 4, 4, '#7a7e8a'); px(x + 2, y - 14, 4, 4, '#7a7e8a');
      px(x - 4, y - 6, 3, 2, '#d23f3a'); px(x + 1, y - 6, 3, 2, '#d23f3a'); px(x - 3, y - 1, 6, 2, '#4a4e5a');
      px(x - 8, y + 8, 6, 3, '#5a5e6a'); px(x + 2, y + 8, 6, 3, '#5a5e6a'); break;
    }
    case 'shade': {
      const f = Math.sin(t * 2 + x) * 1.5;
      px(x - 6, y - 12 + f, 12, 6, '#1a1426'); px(x - 7, y - 6 + f, 14, 14, '#241a36'); px(x - 8, y + 6 + f, 16, 4, '#241a36');
      px(x - 3, y - 9 + f, 2, 1, '#c07ad8'); px(x + 1, y - 9 + f, 2, 1, '#c07ad8');
      px(x - 11, y - 2 + f, 5, 6, '#c8b890'); px(x - 10, y - 1 + f, 1, 4, '#7a3a3a'); break;
    }
    case 'warden': {
      const f = Math.sin(t * 1.5) * 2;
      ctx.globalAlpha = .1; fill('#f5a93a'); ctx.beginPath(); ctx.arc(x, y, 28 * k, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
      px(x - 17 * k, y + 19 * k, 34 * k, 3, 'rgba(0,0,0,.35)');
      px(x - 10 * k, y - 26 * k + f, 20 * k, 10 * k, '#2a2440');
      px(x - 14 * k, y - 16 * k + f, 28 * k, 28 * k, '#3a3258');
      px(x - 18 * k, y + 10 * k + f, 36 * k, 9 * k, '#3a3258');
      px(x - 20 * k, y - 10 * k + f, 6 * k, 18 * k, '#2e2848'); px(x + 14 * k, y - 10 * k + f, 6 * k, 18 * k, '#2e2848');
      px(x - 5 * k, y - 22 * k + f, 3 * k, 2 * k, '#f5a93a'); px(x + 2 * k, y - 22 * k + f, 3 * k, 2 * k, '#f5a93a');
      const cy2 = y - 2 * k + f;
      fill('#e8dcb0'); ctx.beginPath(); ctx.arc(x, cy2, 8 * k, 0, 7); ctx.fill();
      stroke('#3a2a1a'); ctx.lineWidth = 1; ctx.beginPath();
      const a = -t * 2; // hands run backwards
      ctx.moveTo(x, cy2); ctx.lineTo(x + Math.cos(a) * 6 * k, cy2 + Math.sin(a) * 6 * k);
      ctx.moveTo(x, cy2); ctx.lineTo(x + Math.cos(a / 12) * 4 * k, cy2 + Math.sin(a / 12) * 4 * k); ctx.stroke();
      break;
    }
  }
}

function drawNPC(n, t, ox = 0, oy = 0) {
  const x = (n.x * TS) + ox, y = (n.y * TS - 4) + oy;
  switch (n.kind) {
    case 'person': if (!drawWalker(npcSheet(n.look), x, y + 15, n.dir || 'down', false, t)) drawPerson(x, y, { ...LOOKS[n.look], dir: n.dir }); break;
    case 'ghost': {
      ctx.globalAlpha = .55;
      if (!drawWalker(npcSheet('ghost'), x, y + 15 + Math.sin(t * 2) * 1.5, n.dir || 'down', false, t))
        drawPerson(x, y + Math.sin(t * 2) * 1.5, { robe: '#cfe0ff', trim: '#ffffff', hair: '#e8f0ff', skin: '#e8f0ff', dir: n.dir });
      ctx.globalAlpha = 1; break;
    }
    case 'lantern': {
      const glow = S && S.house ? HOUSES[S.house].color : '#f2e6c9';
      px(x + 7, y - 2, 1, 4, '#8a8a9a'); px(x + 3, y + 2, 10, 2, '#7a6a3a'); px(x + 4, y + 4, 8, 9, '#5a4a2a');
      ctx.globalAlpha = .75 + .25 * Math.sin(t * 4); px(x + 5, y + 5, 6, 7, glow); ctx.globalAlpha = 1;
      px(x + 3, y + 13, 10, 2, '#7a6a3a'); px(x + 3, y + 18, 10, 2, 'rgba(0,0,0,.25)');
      break;
    }
    case 'dummy': drawFoe('dummy', x + 8, y + 6, t); break;
    case 'imps': drawFoe('imp', x + 5, y + 6, t); drawFoe('imp', x + 12, y + 12, t + 1); break;
    case 'warden': drawFoe('warden', x + 8, y + 2, t, .55); break;
  }
}

async function sortingCeremony() {
  const tally = { ember: 0, tide: 0, thorn: 0, gale: 0 };
  let last = 'ember';
  const qs = [
    ['A door stands locked before you. What do you do?', ['Burn it down.', 'Study the lock.', 'Wait for a friend with the key.', 'Climb through the window above it.']],
    ['What do you fear most?', ['Being a coward.', 'Being a fool.', 'Being alone.', 'Being ordinary.']],
    ['What would you give to have your memories back?', ['My comfort.', 'My certainty.', 'Nothing that belongs to someone else.', 'Anything at all.']],
  ];
  await say('Oracle Lantern', 'The flame inside the Lantern leans toward you, the way a flower leans toward a window.');
  for (const [q, opts] of qs) {
    const i = await choose('Oracle Lantern', q, opts);
    last = HOUSE_ORDER[i]; tally[last]++;
  }
  const best = HOUSE_ORDER.slice().sort((a, b) => (tally[b] - tally[a]) || ((b === last) - (a === last)))[0];
  S.house = best;
  await say('Oracle Lantern', `${HOUSES[best].name.toUpperCase()}! ${HOUSES[best].motto}.`);
}

// ---------------------------------------------------------------- field
function loadMap(id, x, y, dir) {
  MAPID = id; MAP = MAPS[id];
  P = { x, y, tx: x, ty: y, dir: dir || 'down', moving: false, prog: 0, step: 0 };
  S.map = id; S.x = x; S.y = y; S.dir = P.dir;
  mode = 'explore';
  spawnField();
  updateCamera();
}
function spawnField() {
  FIELD = [];
  const cfg = MAP.foes && MAP.foes();
  if (!cfg) return;
  cfg.spots.forEach(([x, y]) => {
    const group = pick(cfg.groups);
    FIELD.push({ x, y, tx: x, ty: y, hx: x, hy: y, prog: 0, moving: false, timer: rnd(.4, 1.4), group, art: FOES[group[0]].art });
  });
}
async function enterMap(id, x, y, dir) {
  lock++;
  try {
    await fadeOut();
    loadMap(id, x, y, dir);
    await sleep(60);
    await fadeIn();
    toast(MAP.name);
    save();
    if (MAP.onEnter) await MAP.onEnter();
  } finally { lock--; }
}
const STEP = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
function walkable(x, y, forFoe) {
  if (x < 0 || y < 0 || x >= mapW() || y >= mapH()) return false;
  const c = tileAt(x, y);
  if (c === 'g') { if (!S.flags.archiveOpen) return false; }
  else if (SOLID.has(c)) return false;
  if (npcAt(x, y)) return false;
  if (forFoe) {
    if (MAP.exits.some(e => e.x === x && e.y === y)) return false;
    if (FIELD.some(f => (f.x === x && f.y === y) || (f.tx === x && f.ty === y))) return false;
  }
  return true;
}
function pPos() { return [(P.x + (P.tx - P.x) * P.prog) * TS, (P.y + (P.ty - P.y) * P.prog) * TS]; }
function fPos(f) { return [(f.x + (f.tx - f.x) * f.prog) * TS, (f.y + (f.ty - f.y) * f.prog) * TS]; }
function updateCamera() {
  const [ppx, ppy] = pPos(), mw = mapW() * TS, mh = mapH() * TS;
  cam.x = mw <= W ? -(W - mw) / 2 : clamp(ppx + 8 - W / 2, 0, mw - W);
  cam.y = mh <= H ? -(H - mh) / 2 : clamp(ppy + 8 - H / 2, 0, mh - H);
}

function updateExplore(dt) {
  const frozen = lock > 0 || handlers.length > 0;
  if (P.moving) {
    P.prog += dt * 5.5;
    if (P.prog >= 1) { P.x = P.tx; P.y = P.ty; P.moving = false; P.prog = 0; S.x = P.x; S.y = P.y; S.dir = P.dir; onArrive(); }
  }
  if (!P.moving && !frozen) {
    const d = curDir();
    if (d) {
      P.dir = d;
      const nx = P.x + STEP[d][0], ny = P.y + STEP[d][1];
      if (walkable(nx, ny)) { P.tx = nx; P.ty = ny; P.moving = true; P.prog = 0; P.step ^= 1; }
    }
  }
  updateCamera();
  if (frozen) return;
  grace -= dt;
  for (const f of FIELD) {
    if (f.moving) { f.prog += dt * 2.6; if (f.prog >= 1) { f.x = f.tx; f.y = f.ty; f.moving = false; f.prog = 0; } continue; }
    f.timer -= dt; if (f.timer > 0) continue;
    f.timer = rnd(.5, 1.5);
    let d;
    const dx = P.x - f.x, dy = P.y - f.y;
    if (Math.abs(dx) + Math.abs(dy) < 5 && Math.random() < .55) d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    else d = pick(DIRS);
    const nx = f.x + STEP[d][0], ny = f.y + STEP[d][1];
    if (Math.abs(nx - f.hx) + Math.abs(ny - f.hy) <= 4 && walkable(nx, ny, true)) { f.tx = nx; f.ty = ny; f.moving = true; f.prog = 0; }
  }
  if (grace <= 0) {
    const [ppx, ppy] = pPos();
    const hit = FIELD.find(f => { const [fx, fy] = fPos(f); return Math.hypot(fx - ppx, fy - ppy) < 12; });
    if (hit) encounter(hit);
  }
}
async function encounter(f) {
  FIELD = FIELD.filter(o => o !== f);
  if (P.moving) { P.x = P.tx; P.y = P.ty; P.moving = false; P.prog = 0; }
  await fight(f.group, {});
  grace = 1.5;
}
function onArrive() {
  const e = MAP.exits.find(e => e.x === P.x && e.y === P.y && (!e.cond || e.cond()));
  if (e) enterMap(e.to, e.tx, e.ty, P.dir);
}
function exploreAction(a) {
  if (a === 'cancel' || a === 'menu') { openPause(); return; }
  if (a !== 'ok' || P.moving) return;
  const fx = P.x + STEP[P.dir][0], fy = P.y + STEP[P.dir][1];
  const n = npcAt(fx, fy);
  if (n) {
    if (n.dir) n.dir = { up: 'down', down: 'up', left: 'right', right: 'left' }[P.dir];
    run(n.talk); return;
  }
  const c = tileAt(fx, fy);
  if (c === 'g') run(gateScript);
  else if (c === 'f') run(async () => { restoreParty(); await say(null, 'You drink from the fountain. The water tastes of rain and copper. You feel completely restored.'); });
  else if (c === 'B' && LORE[MAPID]) run(() => say(null, pick(LORE[MAPID])));
  else if (c === '~') run(() => say(null, 'Something large croaks beneath the surface, then thinks better of it.'));
  else if (c === 'w') run(() => say(null, 'Through the glass you can see the far towers. One of them has a clock. You are sure it was not there a moment ago.'));
  else if (c === 'K') run(() => say(null, 'Petals drift down from the blossom tree and settle on your sleeve. They smell like the first day of something.'));
}

// ---------------------------------------------------------------- pause menu
function openPause() {
  run(async () => {
    const st = heroStats(S.lv);
    const nr = nextRank(S.lv);
    const toNext = S.lv >= MAXLV ? 'Max level' : `${XP[S.lv + 1] - S.xp} XP to Lv ${S.lv + 1}`;
    const card = (nm, sub, hp, mhp, mp, mmp, extra) => `<div class="pc"><span class="nm">${esc(nm)}</span><span class="dim">${esc(sub)}</span><span>HP ${hp}/${mhp} &middot; MP ${mp}/${mmp}</span><span class="dim">${esc(extra)}</span></div>`;
    let html = `<section><h3 class="tab">Party</h3>${card(S.name, `${S.house ? HOUSES[S.house].name : 'Unsorted'} · Lv ${S.lv}`, S.hp, st.maxhp, S.mp, st.maxmp, rankOf(S.lv))}`;
    if (S.mira) { const ms = miraStats(miraLv()); html += card('Mira Fenwick', `Tidewyrm · Lv ${miraLv()}`, S.mira.hp, ms.maxhp, S.mira.mp, ms.maxmp, 'Scholar'); }
    html += `<div class="dim">${esc(toNext)}${nr ? ` · next rank ${esc(nr[1])} at Lv ${nr[0]}` : ''}</div></section>`;
    const sp = heroSpells(S.lv, S.house);
    html += `<section><h3 class="tab">Spells</h3>${sp.length ? `<div>${sp.map(k => esc(SPELLS[k].name)).join(' · ')}</div>` : '<div class="dim">None yet. Your spark is asleep.</div>'}</section>`;
    html += `<section><h3 class="tab">Satchel</h3><div>Moonleaf Tonic x${S.items.tonic} <span class="dim">(heals 50, revives)</span><br>Ether Drop x${S.items.ether} <span class="dim">(restores 15 MP)</span></div></section>`;
    html += `<section><h3 class="tab">Recovered memories</h3>${S.memories.length ? `<ul>${S.memories.map(l => `<li>${esc(MEMORIES[l])}</li>`).join('')}</ul>` : '<div class="dim">Nothing yet. They return as your magic does.</div>'}</section>`;
    html += `<section><h3 class="tab">Goal</h3><div>${esc(S.goal)}</div></section>`;
    $('pausebody').innerHTML = html;
    $('pause').hidden = false;
    while (true) {
      const i = await menu($('pausemenu'), [{ label: 'Resume' }, { label: 'Save game' }, { label: 'Quit to title' }]);
      if (i === 1) { save(); toast('Game saved'); continue; }
      $('pause').hidden = true;
      if (i === 2) { save(); MAP = null; titleFlow(); }
      return;
    }
  });
}

const aliveFoes = () => B.foes.filter(f => f.hp > 0);
const aliveParty = () => B.party.filter(p => p.hp > 0);
function makeHero() {
  const st = heroStats(S.lv);
  return { id: 'hero', name: S.name, ...st, hp: Math.min(S.hp, st.maxhp), mp: Math.min(S.mp, st.maxmp), ally: true, spells: heroSpells(S.lv, S.house), atb: rnd(40, 75) };
}
function makeMira() {
  const lv = miraLv(), st = miraStats(lv);
  return { id: 'mira', name: 'Mira', ...st, hp: Math.min(S.mira.hp, st.maxhp), mp: Math.min(S.mira.mp, st.maxmp), ally: true, spells: miraSpells(lv), atb: rnd(30, 65) };
}
function startBattle(keys, opts) {
  return new Promise(res => {
    const party = [makeHero()];
    if (S.mira) party.push(makeMira());
    const pp = party.length === 1 ? [[368, 118]] : [[356, 98], [392, 138]];
    party.forEach((p, i) => { p.bx = pp[i][0]; p.by = pp[i][1]; });
    const fp = { 1: [[128, 118]], 2: [[112, 94], [152, 140]], 3: [[92, 88], [156, 108], [104, 148]] }[keys.length];
    const foes = keys.map((k, i) => ({ ...FOES[k], key: k, maxhp: FOES[k].hp, ally: false, atb: rnd(0, 45), bx: fp[i][0], by: fp[i][1] }));
    if (keys.length === 1 && FOES[keys[0]].art === 'warden') { foes[0].bx = 128; foes[0].by = 108; }
    B = { party, foes, opts, res, queue: [], busy: false, menu: false, cursor: null, fx: [], t: 0, over: false, actor: null };
    mode = 'battle';
    buildPartyPanel();
    $('cmdtitle').textContent = ''; $('cmdlist').innerHTML = '';
    $('battle').hidden = false;
    banner(keys.length === 1 ? FOES[keys[0]].name : `${FOES[keys[0]].name} and others`, 1300);
  });
}
function buildPartyPanel() {
  const el = $('party'); el.innerHTML = '';
  B.party.forEach(p => {
    const r = document.createElement('div'); r.className = 'prow';
    r.innerHTML = `<span class="pn">${esc(p.name)}</span>`
      + `<span class="stat"><span><span class="lbl">HP</span><span class="hpv"></span></span><span class="bar hp"><i></i></span></span>`
      + `<span class="stat"><span><span class="lbl">MP</span><span class="mpv"></span></span><span class="bar mp"><i></i></span></span>`
      + `<span class="atb"><i></i></span>`;
    el.appendChild(r);
    p.ui = { row: r, hp: r.querySelector('.hpv'), mp: r.querySelector('.mpv'), hpb: r.querySelector('.bar.hp i'), mpb: r.querySelector('.bar.mp i'), bar: r.querySelector('.atb i'), last: '' };
  });
}
function updatePartyPanel() {
  for (const p of B.party) {
    const key = `${p.hp}|${p.mp}|${Math.floor(p.atb)}|${B.queue.includes(p)}|${B.actor === p}`;
    if (key === p.ui.last) continue;
    p.ui.last = key;
    p.ui.hp.textContent = `${p.hp}/${p.maxhp}`; p.ui.mp.textContent = `${p.mp}`;
    p.ui.hpb.style.width = `${100 * p.hp / p.maxhp}%`; p.ui.mpb.style.width = `${p.maxmp ? 100 * p.mp / p.maxmp : 0}%`;
    p.ui.bar.style.width = `${p.atb}%`;
    p.ui.row.classList.toggle('ko', p.hp <= 0);
    p.ui.row.classList.toggle('ready', p.hp > 0 && p.atb >= 100);
    p.ui.row.classList.toggle('active', B.actor === p);
  }
}

function updateBattle(dt) {
  B.t += dt;
  B.fx = B.fx.filter(f => B.t - f.t0 < f.dur);
  if (B.over || B.busy || B.menu) return;
  B.queue = B.queue.filter(p => p.hp > 0);
  if (B.queue.length) { openCommand(B.queue[0]); return; }
  for (const c of [...B.party, ...B.foes]) {
    if (c.hp <= 0) continue;
    c.atb = Math.min(100, c.atb + c.spd * (c.haste ? 1.6 : 1) * dt * 7);
    if (c.atb >= 100) {
      if (c.ally) { if (!B.queue.includes(c)) B.queue.push(c); }
      else { B.busy = true; foeAct(c).then(afterAction); return; }
    }
  }
}
function afterAction() {
  if (!B || B.over) return;
  B.busy = false;
  if (B.foes.every(f => f.hp <= 0)) endBattle('win');
  else if (B.party.every(p => p.hp <= 0)) endBattle('lose');
}
async function endBattle(r) {
  B.over = true;
  B.actor = null; B.cursor = null; canvasPick = null;
  $('cmdlist').innerHTML = ''; $('cmdtitle').textContent = '';
  if (r === 'win') { banner('Victory!', 1100); await sleep(1100); }
  else if (r === 'lose') { banner('Your party has fallen...', 1300); await sleep(1300); }
  const hero = B.party.find(p => p.id === 'hero'), mira = B.party.find(p => p.id === 'mira');
  S.hp = Math.max(1, hero.hp); S.mp = hero.mp;
  if (mira) { S.mira.hp = Math.max(1, mira.hp); S.mira.mp = mira.mp; }
  const xp = B.foes.reduce((a, f) => a + f.xp, 0);
  const drops = { tonic: 0, ether: 0 };
  if (r === 'win') B.foes.forEach(() => { if (Math.random() < .25) drops.tonic++; if (Math.random() < .1) drops.ether++; });
  const res = B.res;
  B = null; mode = 'explore';
  $('battle').hidden = true; $('banner').hidden = true;
  res({ r, xp, drops });
}

function openCommand(a) {
  B.menu = true; B.actor = a;
  commandFlow(a).then(() => {
    if (!B || B.over) return;
    B.menu = false; B.actor = null;
    $('cmdtitle').textContent = ''; $('cmdlist').innerHTML = '';
    afterAction();
  });
}
function techReady() {
  const h = B.party.find(p => p.id === 'hero'), m = B.party.find(p => p.id === 'mira');
  return h && m && h.hp > 0 && m.hp > 0 && h.atb >= 100 && m.atb >= 100 && h.mp >= 4 && m.mp >= 4 && S.lv >= 2;
}
async function commandFlow(a) {

    const cmds = [
      { label: 'Attack' },
      { label: 'Magic', dis: !a.spells.length },
      ...(S.mira ? [{ label: 'Tech', sub: S.house ? HOUSES[S.house].tech : '', dis: !techReady() }] : []),
      { label: 'Item' },
      { label: 'Focus' },
      { label: 'Flee', dis: !!B.opts.noFlee },
    ];
    $('cmdtitle').textContent = a.name;
    const i = await menu($('cmdlist'), cmds);
    if (i < 0) { if (B.queue.length > 1) { B.queue.push(B.queue.shift()); return; } continue; }
    const c = cmds[i].label;
    if (c === 'Attack') { const t = await pickTarget(aliveFoes()); if (!t) continue; await doAttack(a, t); }
    else if (c === 'Magic') {
      $('cmdtitle').textContent = `${a.name}: Magic`;
      const list = a.spells.map(k => ({ label: SPELLS[k].name, sub: `${SPELLS[k].mp}`, dis: a.mp < SPELLS[k].mp || (SPELLS[k].tgt === 'other' && !aliveParty().some(p => p !== a)) }));
      const j = await menu($('cmdlist'), list);
      if (j < 0) continue;
      const sp = SPELLS[a.spells[j]];
      let tg = null;
      if (sp.tgt === 'one') { tg = await pickTarget(aliveFoes()); if (!tg) continue; }
      else if (sp.tgt === 'ally') { tg = await pickTarget(aliveParty()); if (!tg) continue; }
      else if (sp.tgt === 'other') { tg = await pickTarget(aliveParty().filter(p => p !== a)); if (!tg) continue; }
      await doSpell(a, sp, tg);
    }
    else if (c === 'Tech') { await doTech(); return; }
    else if (c === 'Item') {
      $('cmdtitle').textContent = 'Satchel';
      const list = [{ k: 'tonic', label: 'Moonleaf Tonic', sub: `x${S.items.tonic}`, dis: !S.items.tonic }, { k: 'ether', label: 'Ether Drop', sub: `x${S.items.ether}`, dis: !S.items.ether }];
      const j = await menu($('cmdlist'), list);
      if (j < 0) continue;
      const tg = await pickTarget(list[j].k === 'tonic' ? B.party : aliveParty());
      if (!tg) continue;
      await useItem(list[j].k, tg);
    }
    else if (c === 'Focus') await doFocus(a);
    else if (c === 'Flee') {
      if (Math.random() < .75) { banner('You slip away!'); await sleep(700); endBattle('flee'); return; }
      banner('Couldn\'t get away!'); await sleep(700);
    }
    break;
  }

  B.queue = B.queue.filter(x => x !== a);
}
function pickTarget(cands) {
  return new Promise(res => {
    if (!cands.length) { res(null); return; }
    let i = 0;
    const title = $('cmdtitle'), prev = title.textContent;
    const show = () => { B.cursor = cands[i]; title.textContent = `Target: ${cands[i].name}`; };
    const fin = v => { pop(h); B.cursor = null; canvasPick = null; title.textContent = prev; res(v); };
    const h = a => {
      if (a === 'up' || a === 'left') { i = (i - 1 + cands.length) % cands.length; show(); }
      else if (a === 'down' || a === 'right') { i = (i + 1) % cands.length; show(); }
      else if (a === 'ok') fin(cands[i]);
      else if (a === 'cancel') fin(null);
    };
    canvasPick = (x, y) => { let best = null, bd = 34; cands.forEach(c => { const d = Math.hypot(c.bx - x, c.by - y); if (d < bd) { bd = d; best = c; } }); if (best) fin(best); };
    push(h); show();
  });
}

function calcDmg(a, d, kind, pow = 0, elem = null) {
  let v = kind === 'phys' ? a.atk * 2 - d.def : pow + a.mag * 1.6 - d.def * .5;
  let mult = 1, tag = '';
  if (elem && d.weak && d.weak.includes(elem)) { mult = 1.75; tag = 'weak'; }
  else if (elem && d.resist && d.resist.includes(elem)) { mult = .5; tag = 'resist'; }
  if (kind === 'phys' && Math.random() < .1) { mult *= 1.5; tag = 'crit'; }
  return { d: Math.max(1, Math.round(v * mult * rnd(.9, 1.1))), tag };
}
const fx = o => B.fx.push({ t0: B.t, ...o });
const num = (c, text, color, dy = 0) => fx({ type: 'num', x: c.bx, y: c.by - 16 + dy, text: String(text), color, dur: 1 });
const ring = (c, color = '#dfe5df') => fx({ type: 'ring', x: c.bx, y: c.by, color, dur: .4 });
const spark = (c, color) => fx({ type: 'spark', x: c.bx, y: c.by, color, dur: .8 });
const proj = (a, t, color, elem) => fx({ type: 'proj', x0: a.bx, y0: a.by, x1: t.bx, y1: t.by, color, elem, dur: .35 });
function damage(t, d, tag, color = '#dfe5df', elem) {
  t.hp = Math.max(0, t.hp - d); t.flash = B.t;
  fx({ type: 'burst', x: t.bx, y: t.by, color, elem, dur: .4 });
  num(t, d, '#ffffff');
  if (tag === 'weak') num(t, 'WEAK', '#f5a93a', -9);
  else if (tag === 'resist') num(t, 'RESIST', '#9aa3c8', -9);
  else if (tag === 'crit') num(t, 'CRITICAL', '#f08aa0', -9);
  if (t.hp <= 0) { t.deadT = B.t; t.atb = 0; }
}
async function doAttack(a, t) {
  a.lungeT = B.t; await sleep(150);
  const r = calcDmg(a, t, 'phys'); damage(t, r.d, r.tag);
  await sleep(450);
}
async function doSpell(a, sp, tg) {
  a.mp -= sp.mp; banner(sp.name, 900); ring(a, ELEM_COLOR[sp.elem] || ELEM_COLOR.heal);
  await sleep(250);
  if (sp.heal) {
    const tgts = sp.tgt === 'allies' ? aliveParty() : [tg];
    for (const t of tgts) { const amt = Math.round(sp.heal + a.mag * 1.2); t.hp = Math.min(t.maxhp, t.hp + amt); spark(t, ELEM_COLOR.heal); num(t, amt, ELEM_COLOR.heal); }
    await sleep(650); return;
  }
  if (sp.haste) { tg.haste = true; tg.atb = 100; spark(tg, ELEM_COLOR.time); num(tg, 'HASTE', ELEM_COLOR.time); await sleep(650); return; }
  const tgts = sp.tgt === 'all' ? aliveFoes() : [tg];
  const col = ELEM_COLOR[sp.elem];
  tgts.forEach(t => proj(a, t, col, sp.elem));
  await sleep(350);
  tgts.forEach(t => { const r = calcDmg(a, t, 'mag', sp.pow, sp.elem); damage(t, r.d, r.tag, col, sp.elem); });
  await sleep(550);
}
async function doTech() {
  const h = B.party.find(p => p.id === 'hero'), m = B.party.find(p => p.id === 'mira');
  const house = HOUSES[S.house || 'tide'];
  h.mp -= 4; m.mp -= 4;
  banner(house.tech, 1100);
  ring(h, ELEM_COLOR[house.elem]); ring(m, ELEM_COLOR.water);
  await sleep(300);
  const tgts = aliveFoes();
  tgts.forEach(t => { proj(h, t, ELEM_COLOR[house.elem], house.elem); proj(m, t, ELEM_COLOR.water, 'water'); });
  await sleep(380);
  tgts.forEach(t => {
    const v = Math.round((40 + (h.mag + m.mag) * 1.2 - t.def * .3) * rnd(.95, 1.05));
    damage(t, Math.max(1, v), '', '#f2e6c9', house.elem);
  });
  if (S.house === 'thorn') aliveParty().forEach(p => { p.hp = Math.min(p.maxhp, p.hp + 25); spark(p, ELEM_COLOR.heal); });
  await sleep(600);
  [h, m].forEach(p => { p.atb = 0; });
  B.queue = B.queue.filter(p => p !== h && p !== m);
}
async function useItem(k, t) {
  S.items[k]--;
  if (k === 'tonic') { banner('Moonleaf Tonic', 800); const was = t.hp; t.hp = Math.min(t.maxhp, t.hp + 50); if (was <= 0) t.deadT = null; spark(t, ELEM_COLOR.heal); num(t, t.hp - was, ELEM_COLOR.heal); }
  else { banner('Ether Drop', 800); const was = t.mp; t.mp = Math.min(t.maxmp, t.mp + 15); spark(t, ELEM_COLOR.water); num(t, `+${t.mp - was} MP`, ELEM_COLOR.water); }
  await sleep(700);
}
async function doFocus(a) {
  if (a.maxmp === 0) { banner('You reach for magic. Nothing answers... yet.', 1500); await sleep(1300); return; }
  const g = Math.max(3, Math.round(a.maxmp * .2)), was = a.mp;
  a.mp = Math.min(a.maxmp, a.mp + g); banner('Focus', 700); spark(a, ELEM_COLOR.arcane); num(a, `+${a.mp - was} MP`, ELEM_COLOR.water);
  await sleep(700);
}
async function foeAct(f) {
  const tg = aliveParty(); f.atb = 0;
  if (!tg.length) return;
  if (f.key === 'warden' && !f.rewound && f.hp < f.maxhp * .4) {
    f.rewound = true; banner('Rewind', 1100); spark(f, ELEM_COLOR.time); ring(f, ELEM_COLOR.time);
    await sleep(450); const amt = 240; f.hp = Math.min(f.maxhp, f.hp + amt); num(f, amt, ELEM_COLOR.heal); await sleep(700); return;
  }
  const act = pick(f.acts), t = pick(tg), col = ELEM_COLOR[f.elem] || '#dfe5df';
  if (act === 'hit') { f.lungeT = B.t; await sleep(150); const r = calcDmg(f, t, 'phys'); damage(t, r.d, r.tag); await sleep(450); }
  else if (act === 'spell') { f.lungeT = B.t; banner(f.spellName || 'Hex', 900); ring(f, col); await sleep(250); proj(f, t, col, f.elem); await sleep(350); const r = calcDmg(f, t, 'mag', 10, f.elem); damage(t, r.d, '', col, f.elem); await sleep(450); }
  else { f.lungeT = B.t; banner(f.allName || 'Wave', 900); ring(f, col); await sleep(300); tg.forEach(p => proj(f, p, col, f.elem)); await sleep(350); tg.forEach(p => { const r = calcDmg(f, p, 'mag', 8, f.elem); damage(p, Math.max(1, Math.round(r.d * .7)), '', col, f.elem); }); await sleep(500); }
}

async function fight(keys, opts = {}) {
  lock++;
  try {
    const out = await startBattle(keys, opts);
    if (out.r === 'win') await rewards(out.xp, out.drops);
    else if (out.r === 'lose') await defeat();
    save();
    return out.r;
  } finally { lock--; }
}
async function rewards(xp, drops) {
  const parts = [`Victory! ${xp} XP.`];
  if (drops.tonic) parts.push(`Found ${drops.tonic} Moonleaf Tonic${drops.tonic > 1 ? 's' : ''}.`);
  if (drops.ether) parts.push(`Found ${drops.ether} Ether Drop${drops.ether > 1 ? 's' : ''}.`);
  S.items.tonic += drops.tonic; S.items.ether += drops.ether;
  await say(null, parts.join(' '));
  if (S.lv >= MAXLV) return;
  S.xp += xp;
  while (S.lv < MAXLV && S.xp >= XP[S.lv + 1]) {
    const before = heroSpells(S.lv, S.house), oldRank = rankOf(S.lv);
    S.lv++;
    restoreParty();
    const learned = heroSpells(S.lv, S.house).filter(k => !before.includes(k));
    let msg = `${S.name} reached Level ${S.lv}!`;
    if (learned.length) msg += ` Learned ${learned.map(k => SPELLS[k].name).join(' and ')}.`;
    await say(null, msg);
    if (rankOf(S.lv) !== oldRank) await say(null, `New rank: ${rankOf(S.lv)}.`);
    if (MEMORIES[S.lv] && !S.memories.includes(S.lv)) { S.memories.push(S.lv); await say('A memory returns', MEMORIES[S.lv], { memory: true }); }
    if (S.lv === 5 && S.flags.mira && !S.flags.archiveOpen) setGoal('Examine the Archive seal at the north wall of the Library.');
    if (S.lv === MAXLV && !S.flags.archwizard) { S.flags.archwizard = true; setGoal('You are an Archwizard. Wander Aldermere as long as you like.'); await finale(); }
  }
}
async function defeat() {
  await fadeOut();
  restoreParty();
  loadMap('courtyard', 14, 10, 'up');
  await fadeIn();
  await say('Nurse Hollis', 'Back with us? Someone carried you out in a heap. It happens to every first-year at least once.');
  await say('Nurse Hollis', 'You are patched up. Try not to do it again before lunch. The fountain is there if you need it.');
}

    } else if (f.type === 'spark') {
      ctx.globalAlpha = 1 - p;
      for (let i = 0; i < 7; i++) px(f.x + Math.cos(i * 2.4) * 7, f.y + 6 - p * 18 - (i % 3) * 3, 1, 2, f.color);
      ctx.globalAlpha = 1;
    } else if (f.type === 'num') {
      const y = f.y - Math.min(1, p * 3) * 6;
      ctx.globalAlpha = p > .75 ? (1 - p) * 4 : 1;
      ctx.font = '600 10px "Pixelify Sans", monospace'; ctx.textAlign = 'center';
      ctx.lineWidth = 3; stroke('#0b0d18'); ctx.strokeText(f.text, f.x, y); fill(f.color); ctx.fillText(f.text, f.x, y);
      ctx.globalAlpha = 1;
    }
  }
}
function drawCombatant(c) {
  if (c.hp <= 0 && !c.ally) {
    if (c.deadT == null) return;
    const p = (B.t - c.deadT) / .5; if (p >= 1) return; ctx.globalAlpha = 1 - p;
  }
  const hurt = c.flash != null && B.t - c.flash < .3;
  if (hurt && ((B.t * 30) | 0) % 2 === 0) { ctx.globalAlpha = 1; return; }
  let ox = 0, lunging = false;
  if (c.lungeT != null) { const p = (B.t - c.lungeT) / .3; if (p < 1) { ox = Math.sin(p * Math.PI) * 18 * (c.ally ? -1 : 1); lunging = true; } }
  if (c.ally) {
    const look = c.id === 'hero' ? heroLook() : LOOKS.mira;
    const sheet = c.id === 'hero' ? heroSheet() : npcSheet('mira');
    if (c.hp <= 0) { px(c.bx - 8, c.by + 2, 12, 5, look.robe); px(c.bx + 3, c.by + 1, 5, 5, look.skin); px(c.bx + 4, c.by, 5, 2, look.hair); }
    else if (!drawWalker(sheet, c.bx - 8 + ox, c.by + 5, 'left', c.atb >= 100 || lunging, B.t))
      drawPerson(c.bx - 8 + ox, c.by - 10, { ...look, dir: 'left', step: c.atb >= 100 ? ((B.t * 4) | 0) % 2 : 0 });
  } else drawFoe(c.art, c.bx + ox, c.by, B.t, c.key === 'echo' ? .75 : 1, hurt ? 'hurt' : lunging ? 'attack' : 'idle');
  ctx.globalAlpha = 1;
}
function drawCursor(c) {
  const bob = Math.sin(B.t * 8) * 1.5;
  const top = c.ally ? c.by - 30 : c.by - (c.art === 'warden' ? (c.key === 'echo' ? 30 : 38) : 20);
  fill('#e2b25a');
  ctx.beginPath(); ctx.moveTo(c.bx - 4, top - 6 + bob); ctx.lineTo(c.bx + 4, top - 6 + bob); ctx.lineTo(c.bx, top + bob); ctx.fill();
  if (!c.ally) { px(c.bx - 12, c.by + 18, 24, 3, '#0b0d18'); px(c.bx - 12, c.by + 18, 24 * c.hp / c.maxhp, 3, c.hp / c.maxhp > .35 ? '#2fb3a8' : '#d23f3a'); }
}
function render(t) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = false;
  if (mode === 'title' || !MAP) { drawTitle(t); return; }
  px(0, 0, W, H, '#0b0d18');
  const cx = Math.round(cam.x), cy = Math.round(cam.y);
  ctx.translate(-cx, -cy);
  const bigs = [];
  const x0 = Math.max(0, Math.floor(cx / TS)), x1 = Math.min(mapW(), Math.ceil((cx + W) / TS) + 1);
  const y0 = Math.max(0, Math.floor(cy / TS)), y1 = Math.min(mapH(), Math.ceil((cy + H) / TS) + 1);
  for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) drawTile(x, y, t, bigs);
  bigs.forEach(f => f());
  const ents = visibleNPCs().map(n => ({ y: n.y * TS, draw: () => drawNPC(n, t) }));
  if (mode !== 'battle') {
    FIELD.forEach(f => { const [fx2, fy2] = fPos(f); ents.push({ y: fy2, draw: () => drawFoe(f.art, fx2 + 8, fy2 + 6, t, .5) }); });
    const [ppx, ppy] = pPos();
    ents.push({ y: ppy, draw: () => drawWalker(heroSheet(), ppx, ppy + 12, P.dir, P.moving, t) || drawPerson(ppx, ppy - 4, { ...heroLook(), dir: P.dir, step: P.moving ? P.step : 0 }) });
  }
  ents.sort((a, b) => a.y - b.y).forEach(e => e.draw());
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (MAP.dark) {
    let lx = W / 2, ly = H / 2 - 20, r1 = 230;
    if (mode !== 'battle') { const [ppx, ppy] = pPos(); lx = ppx + 8 - cx; ly = ppy + 6 - cy; r1 = 120; }
    const g = ctx.createRadialGradient(lx, ly, 22, lx, ly, r1);
    g.addColorStop(0, 'rgba(6,4,16,0)'); g.addColorStop(1, 'rgba(6,4,16,.86)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (mode === 'battle' && B) {
    ctx.fillStyle = 'rgba(8,8,28,.42)'; ctx.fillRect(0, 0, W, H);
    [...B.foes, ...B.party].sort((a, b) => a.by - b.by).forEach(drawCombatant);
    if (B.cursor) drawCursor(B.cursor);
    renderFx();
    updatePartyPanel();
  }
}

// ---------------------------------------------------------------- flow
function askName() {
  return new Promise(res => {
    const box = $('namebox'), inp = $('nameinput');
    box.hidden = false; inp.value = '';
    setTimeout(() => inp.focus(), 60);
    const block = () => {};
    push(block);
    $('nameform').onsubmit = e => {
      e.preventDefault();
      const v = (inp.value || '').trim().replace(/\s+/g, ' ').slice(0, 12) || 'Rowan';
      pop(block); box.hidden = true; inp.blur(); res(v);
    };
  });
}
async function newGame() {
  const name = await askName();
  S = newState(name);
  $('fade').classList.add('on');
  $('title').hidden = true;
  lock++;
  await sleep(350);
  await say(null, 'Cold stone under your cheek. Somewhere above you, a bell is ringing nine.');
  await say(null, 'You try to remember how you got here. There is nothing there. No home. No face. No yesterday.');
  await say(null, `Only a name, ${name}. Even that feels borrowed.`);
  loadMap('courtyard', 14, 10, 'up');
  await fadeIn();
  toast(MAP.name);
  await sleep(900);
  await say(name, '...Where am I?', { face: 'shocked' });
  await say('Prefect Aldous', 'You! Yes, you, lying on the flagstones. Up you get. Orientation started ten minutes ago. Great Hall, north doors. Go!');
  lock--;
  save();
}
async function titleFlow() {
  mode = 'title'; MAP = null; lock = 0;
  $('title').hidden = false; $('dialog').hidden = true; $('battle').hidden = true; $('fade').classList.remove('on');
  const saved = loadSave();
  const i = await menu($('titlemenu'), [{ label: 'Begin your first day' }, { label: 'Continue', dis: !saved }], { start: saved ? 1 : 0, noCancel: true });
  if (i === 1 && saved) { S = saved; $('title').hidden = true; await enterMap(S.map, S.x, S.y, S.dir); }
  else await newGame();
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (mode === 'explore' && MAP && P) updateExplore(dt);
  else if (mode === 'battle' && B) updateBattle(dt);
  render(now / 1000);
  updateHUD();
  requestAnimationFrame(loop);
}

loadAssets();
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => (S && mode === 'explore' ? { save: JSON.stringify(S) } : {}));
function boot(data) {
  requestAnimationFrame(loop);
  if (data && data.save) {
    try { const s = JSON.parse(data.save); if (s.v === 2) { S = s; $('title').hidden = true; enterMap(S.map, S.x, S.y, S.dir); return; } } catch (e) { /* fall through to title */ }
  }
  titleFlow();
}
if (hot && typeof hot.ready === 'function') hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
